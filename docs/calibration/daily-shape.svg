<text x="64" y="48" font-size="12" fill="#52606d">Bars: the fixtures (10,500 cases over 7 days). Line: the calibration shape. Check by eye: afternoon peak, evening shoulder, taper after</text>
<text x="64" y="63" font-size="12" fill="#52606d">22:00, sharp rise from 06:30.</text>
