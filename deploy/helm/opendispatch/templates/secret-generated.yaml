{{- /* Made once at install, kept on upgrade and uninstall; never printed. */ -}}
{{- $name := include "opendispatch.generatedSecret" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $keys := dict "auth-secret" 64 "oidc-client-secret" 48 "keycloak-bootstrap-password" 32 "first-admin-password" 24 "keycloak-idp-admin-secret" 48 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opendispatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $n := $keys }}
  {{ $k }}: {{ index $old $k | default (randAlphaNum $n | b64enc) | quote }}
  {{- end }}
