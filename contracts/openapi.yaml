        data_source: {$ref: '#/components/schemas/DataSource'}
    ForecastExplanation:
      description: 'Why one zone and day has its forecast. base x the product of the drivers'' multipliers = expected (the zone-day total), within rounding. Drivers and their names come from the forecaster (contracts/engines/forecaster.output.schema.json, explanations). Illustrative unless every input is real the customer data.'
      type: object
      additionalProperties: false
      required: [forecast_run_id, zone_id, date, model_version, engine_version, base, expected, drivers, illustrative, data_source]
      properties:
        forecast_run_id: {$ref: '#/components/schemas/Uuid'}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        date: {$ref: '#/components/schemas/LocalDate'}
        model_version: {type: string, maxLength: 64}
        engine_version: {type: string, maxLength: 64}
        training_start: {$ref: '#/components/schemas/LocalDate'}
        training_end: {$ref: '#/components/schemas/LocalDate'}
        history_days: {type: integer, minimum: 0}
        base: {type: number, minimum: 0}
        expected: {type: number, minimum: 0}
        drivers: {type: array, maxItems: 64, items: {$ref: './engines/forecaster.output.schema.json#/$defs/ExplanationDriver'}}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    LocationDayGroup:
      description: 'Day groups of the customer''s plan sheet: weekday (Sunday to Wednesday), thursday, friday, saturday.'
      type: string
      enum: [weekday, thursday, friday, saturday]
    ForecastLocationDistribution:
      description: 'Where inside one sub-zone cases are likely for one hour and day group, highest probability first. A pooled cell is the rest of the sub-zone (a coarser geohash). Positions are SYNTHETIC in the demo and Illustrative unless every input is real the customer data.'
      type: object
      additionalProperties: false
      required: [forecast_run_id, zone_id, sub_zone_id, hour, day_group, cell_precision, model_version, cells, illustrative, data_source]
      properties:
        forecast_run_id: {$ref: '#/components/schemas/Uuid'}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        sub_zone_id: {$ref: '#/components/schemas/Uuid'}
        hour: {type: integer, minimum: 0, maximum: 23}
        day_group: {$ref: '#/components/schemas/LocationDayGroup'}
        cell_precision: {type: integer, minimum: 0, maximum: 12}
        model_version: {type: string, maxLength: 64}
        cells:
          type: array
          maxItems: 400
          items:
            type: object
            additionalProperties: false
            required: [cell_id, probability, pooled, south, west, north, east]
            properties:
              cell_id: {type: string, pattern: '^[0-9b-hjkmnp-z]{1,12}$'}
              probability: {type: number, minimum: 0, maximum: 1}
              pooled: {type: boolean}
              south: {type: number, minimum: -90, maximum: 90}
              west: {type: number, minimum: -180, maximum: 180}
              north: {type: number, minimum: -90, maximum: 90}
              east: {type: number, minimum: -180, maximum: 180}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    RemoteStaffing:
      type: object
      additionalProperties: false
      required: [date, intervals, illustrative, data_source]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        intervals: {type: array, maxItems: 96, items: {$ref: '#/components/schemas/RemoteStaffingInterval'}}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
        handling: {$ref: '#/components/schemas/RemoteHandling', description: 'Optional. The minutes per case behind required_reviewers.'}
    RemoteHandlingUpdate:
      type: object
      additionalProperties: false
      properties:
        handling_source: {$ref: '#/components/schemas/RemoteHandlingSource'}
        handling_fixed_minutes: {type: number, minimum: 5, maximum: 240}
    RemoteHandlingSource:
      type: string
      enum: [measured, fixed]
      description: 'measured: the mean time to complete of recent remote cases. fixed: setting remote.handling_fixed_minutes.'
    RemoteHandling:
      description: 'The minutes of remote work per case that turn expected cases into required reviewers.'
      type: object
      additionalProperties: false
      required: [setting, source, minutes, fixed_minutes, cases, window_days]
      properties:
        setting: {$ref: '#/components/schemas/RemoteHandlingSource'}
        source: {$ref: '#/components/schemas/RemoteHandlingSource', description: 'What was used for the scope: fixed when the setting is fixed or too few cases were measured.'}
        minutes: {type: number, exclusiveMinimum: 0}
        fixed_minutes: {type: number, exclusiveMinimum: 0}
        cases: {type: integer, minimum: 0, description: 'Cases measured for the scope.'}
        window_days: {type: integer, minimum: 1}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, source, minutes, cases]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              source: {$ref: '#/components/schemas/RemoteHandlingSource'}
              minutes: {type: number, exclusiveMinimum: 0}
              cases: {type: integer, minimum: 0}
    RemoteRosterLine:
      description: One remote agent on one date.
      type: object
      additionalProperties: false
      required: [agent_id, code, name_en, name_ar, pool_zone_code, shift_code, start_at, end_at, break_start_at, break_end_at, on_leave, source]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 64}
        name_en: {type: string, maxLength: 200}
        name_ar: {type: [string, 'null'], maxLength: 200}
        pool_zone_code: {type: [string, 'null'], maxLength: 32}
        shift_code: {type: [string, 'null'], maxLength: 64}
        start_at: {$ref: '#/components/schemas/Timestamp'}
        end_at: {$ref: '#/components/schemas/Timestamp'}
        break_start_at: {$ref: '#/components/schemas/NullableTimestamp'}
        break_end_at: {$ref: '#/components/schemas/NullableTimestamp'}
        on_leave: {type: boolean, description: Approved leave on the date; not counted in capacity.}
        source: {type: string, enum: [roster, home_shift]}
    RemoteShiftLoad:
      description: 'Demand and capacity of one shift. shift_code null: intervals no remote shift covers.'
      type: object
      additionalProperties: false
      required: [shift_code, start_at, end_at, scheduled, on_leave, available_hours, capacity_hours, demand_hours, utilization, gap_hours]
      properties:
        shift_code: {type: [string, 'null'], maxLength: 64}
        start_at: {$ref: '#/components/schemas/NullableTimestamp'}
        end_at: {$ref: '#/components/schemas/NullableTimestamp'}
        scheduled: {type: integer, minimum: 0, description: 'Agents on the shift, not on leave.'}
        on_leave: {type: integer, minimum: 0}
        available_hours: {type: number, minimum: 0, description: 'Scheduled agent-hours less breaks.'}
        capacity_hours: {type: number, minimum: 0, description: 'available_hours x reviewer_share: hours of review the pool is planned to give.'}
        demand_hours: {type: number, minimum: 0, description: 'Expected remote cases x handling minutes / 60.'}
        utilization: {type: [number, 'null'], minimum: 0, description: 'demand_hours / available_hours; null with no available hours. May exceed 1.'}
        gap_hours: {type: number, description: 'capacity_hours - demand_hours; negative is a gap.'}
    RemoteDayLoad:
      type: object
      additionalProperties: false
      required: [date, source, scheduled, on_leave, off, available_hours, capacity_hours, demand_hours, utilization, gap_hours, shifts]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        source: {type: string, enum: [roster, home_shifts, none]}
        scheduled: {type: integer, minimum: 0}
        on_leave: {type: integer, minimum: 0}
        off: {type: integer, minimum: 0, description: 'Active remote agents with no shift that date.'}
        available_hours: {type: number, minimum: 0}
        capacity_hours: {type: number, minimum: 0}
        demand_hours: {type: number, minimum: 0}
        utilization: {type: [number, 'null'], minimum: 0}
        gap_hours: {type: number}
        shifts: {type: array, items: {$ref: '#/components/schemas/RemoteShiftLoad'}}
    RemoteRoster:
      type: object
      additionalProperties: false
      required: [date, fte, day, lines, intervals, handling, reviewer_share, illustrative, data_source]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        fte: {type: integer, minimum: 0, description: 'Active remote agents in the scope.'}
        day: {$ref: '#/components/schemas/RemoteDayLoad'}
        lines: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/RemoteRosterLine'}}
        intervals: {type: array, maxItems: 96, items: {$ref: '#/components/schemas/RemoteStaffingInterval'}}
        handling: {$ref: '#/components/schemas/RemoteHandling'}
        reviewer_share: {type: number, exclusiveMinimum: 0, maximum: 1, description: 'Share of on-shift remote agents reviewing at any moment (assumption).'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    RemoteCapacity:
      type: object
      additionalProperties: false
      required: [date_from, date_to, fte, days, weeks, handling, reviewer_share, illustrative, data_source]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        fte: {type: integer, minimum: 0}
        days: {type: array, maxItems: 31, items: {$ref: '#/components/schemas/RemoteDayLoad'}}
        weeks:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [week_start, days, scheduled_shifts, available_hours, capacity_hours, demand_hours, utilization, gap_hours]
            properties:
              week_start: {$ref: '#/components/schemas/LocalDate'}
              days: {type: integer, minimum: 1, maximum: 7}
              scheduled_shifts: {type: integer, minimum: 0}
              available_hours: {type: number, minimum: 0}
              capacity_hours: {type: number, minimum: 0}
              demand_hours: {type: number, minimum: 0}
              utilization: {type: [number, 'null'], minimum: 0}
              gap_hours: {type: number}
        handling: {$ref: '#/components/schemas/RemoteHandling'}
        reviewer_share: {type: number, exclusiveMinimum: 0, maximum: 1}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    RemoteDurations:
      description: 'Medians in seconds over the cases that have both ends; null with none.'
      type: object
      additionalProperties: false
      required: [cases, median_wait_seconds, median_complete_seconds, median_receipt_to_close_seconds, median_post_close_admin_seconds]
      properties:
        cases: {type: integer, minimum: 0}
        median_wait_seconds: {type: [number, 'null'], minimum: 0, description: Registration to review start.}
        median_complete_seconds: {type: [number, 'null'], minimum: 0, description: Review start to close (time to complete a remote survey).}
        median_receipt_to_close_seconds: {type: [number, 'null'], minimum: 0}
        median_post_close_admin_seconds: {type: [number, 'null'], minimum: 0, description: Null until the customer supplies a post-close time.}
    RemoteProductivity:
      type: object
      additionalProperties: false
      required: [date_from, date_to, overall, handled, available_hours, handling_hours, utilization, cases_per_available_hour, hours, case_types, reviewers, unattributed_cases, handling, illustrative, data_sources]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        overall: {$ref: '#/components/schemas/RemoteDurations'}
        handled: {type: integer, minimum: 0, description: 'Cases closed in the period.'}
        available_hours: {type: number, minimum: 0, description: 'Remote agent-hours on shift in the period, less breaks and leave (roster lines, else home shifts).'}
        handling_hours: {type: number, minimum: 0, description: 'Sum of review start to close.'}
        utilization: {type: [number, 'null'], minimum: 0, description: 'handling_hours / available_hours; null with no available hours.'}
        cases_per_available_hour: {type: [number, 'null'], minimum: 0}
        hours:
          description: 'Per Riyadh hour of the day, 0 to 23.'
          type: array
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [hour, received, handled, median_wait_seconds]
            properties:
              hour: {type: integer, minimum: 0, maximum: 23}
              received: {type: integer, minimum: 0, description: Cases registered in the hour.}
              handled: {type: integer, minimum: 0, description: Cases closed in the hour.}
              median_wait_seconds: {type: [number, 'null'], minimum: 0, description: Of the cases whose review started in the hour.}
        case_types:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [case_type_id, cases, mean_complete_minutes, median_complete_seconds]
            properties:
              case_type_id: {$ref: '#/components/schemas/NullableUuid'}
              cases: {type: integer, minimum: 0}
              mean_complete_minutes: {type: [number, 'null'], minimum: 0}
              median_complete_seconds: {type: [number, 'null'], minimum: 0}
        reviewers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [agent_id, durations, available_hours, handling_hours, cases_per_hour, utilization]
            properties:
              agent_id: {$ref: '#/components/schemas/Uuid'}
              durations: {$ref: '#/components/schemas/RemoteDurations'}
              available_hours: {type: number, minimum: 0}
              handling_hours: {type: number, minimum: 0}
              cases_per_hour: {type: [number, 'null'], minimum: 0}
              utilization: {type: [number, 'null'], minimum: 0}
        unattributed_cases: {type: integer, minimum: 0, description: 'Cases with no recorded reviewer (The customer''s file has none).'}
        handling: {$ref: '#/components/schemas/RemoteHandling'}
        illustrative: {type: boolean}
        data_sources: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/DataSource'}}

    UnmetDemandCase:
      description: 'One field case of the day that could not be reached within the service level.'
      type: object
      additionalProperties: false
      required: [case_id, case_number, zone_id, registered_at, cause, nearest_agent_id, nearest_travel_seconds, threshold_seconds, state, data_source]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        case_number: {type: string, maxLength: 64}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        sub_zone_id: {$ref: '#/components/schemas/NullableUuid'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        cause: {type: string, enum: [people, geography]}
        nearest_agent_id: {$ref: '#/components/schemas/NullableUuid'}
        nearest_travel_seconds: {type: [number, 'null'], minimum: 0}
        threshold_seconds: {type: integer, minimum: 1}
        state: {type: string, maxLength: 32}
        data_source: {$ref: '#/components/schemas/DataSource'}
    UnmetDemandList:
      type: object
      additionalProperties: false
      required: [date, threshold_seconds, illustrative, items, page, data_source]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        threshold_seconds: {type: integer, minimum: 1}
        illustrative: {type: boolean}
        items: {type: array, items: {$ref: '#/components/schemas/UnmetDemandCase'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        data_source: {$ref: '#/components/schemas/DataSource'}

    WaitingSpots:
      type: object
      additionalProperties: false
      required: [generated_at, enabled, model_version, illustrative, items, data_source]
      properties:
        generated_at: {$ref: '#/components/schemas/NullableTimestamp'}
        enabled: {type: boolean, description: Setting dispatch.reposition.}
        model_version: {type: [string, 'null'], maxLength: 64}
        illustrative: {type: boolean}
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: false
            required: [agent_id, zone_id, latitude, longitude, move_km, reason_code]
            properties:
              agent_id: {$ref: '#/components/schemas/Uuid'}
              zone_id: {$ref: '#/components/schemas/Uuid'}
              latitude: {type: number, minimum: -90, maximum: 90}
              longitude: {type: number, minimum: -180, maximum: 180}
              move_km: {type: number, minimum: 0}
              reason_code: {type: string, enum: [cover_expected_demand, rebalance_zone]}
        data_source: {$ref: '#/components/schemas/DataSource'}
    LeavePolicy:
      description: 'Assumption, no fields are specified: minimum notice, a cap on concurrent leave and blackout periods.'
      type: object
      additionalProperties: false
      required: [min_notice_days, max_concurrent_leave_share, blackout_periods]
      properties:
        min_notice_days: {type: integer, minimum: 0, maximum: 365}
        max_concurrent_leave_share: {type: number, minimum: 0, maximum: 1}
        blackout_periods:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [start_date, end_date, label_en]
            properties:
              start_date: {$ref: '#/components/schemas/LocalDate'}
              end_date: {$ref: '#/components/schemas/LocalDate'}
              label_en: {type: string, maxLength: 120}
    PrayerTimeRecomputeRequest:
      type: object
      additionalProperties: false
      required: [date_from, date_to]
      properties:
        city_id: {$ref: '#/components/schemas/NullableUuid'}
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
    # ---- Updates (Admin 16). Aliases of the update agent's stub schemas (contracts/platform/update-agent.yaml, owned by the host platform) ----
    UpdateStatus: {$ref: './platform/update-agent.yaml#/components/schemas/Status'}
    UpdateReleaseList: {$ref: './platform/update-agent.yaml#/components/schemas/ReleaseList'}
    UpdateReleaseDetail: {$ref: './platform/update-agent.yaml#/components/schemas/ReleaseDetail'}
    UpdateDownloadState: {$ref: './platform/update-agent.yaml#/components/schemas/DownloadState'}
    UpdatePreflightResult: {$ref: './platform/update-agent.yaml#/components/schemas/PreflightResult'}
    UpdateScheduledUpdate: {$ref: './platform/update-agent.yaml#/components/schemas/ScheduledUpdate'}
    UpdateApplyRun: {$ref: './platform/update-agent.yaml#/components/schemas/ApplyRun'}
    UpdateRecoveryResult: {$ref: './platform/update-agent.yaml#/components/schemas/RecoveryResult'}
    UpdateRestoreRequest: {$ref: './platform/update-agent.yaml#/components/schemas/RestoreRequest'}
    UpdateHistoryList: {$ref: './platform/update-agent.yaml#/components/schemas/HistoryList'}
    UpdateSettings: {$ref: './platform/update-agent.yaml#/components/schemas/UpdateSettings'}
    UpdateConnectionSettings: {$ref: './platform/update-agent.yaml#/components/schemas/ConnectionSettings'}
    UpdateConnectionSettingsWrite: {$ref: './platform/update-agent.yaml#/components/schemas/ConnectionSettingsWrite'}
    UpdateConnectionTestResult: {$ref: './platform/update-agent.yaml#/components/schemas/UpdateConnectionTestResult'}
    UpdateOfflineUploadResult: {$ref: './platform/update-agent.yaml#/components/schemas/OfflineUploadResult'}
    UpdateChangeWindows: {$ref: './platform/update-agent.yaml#/components/schemas/ChangeWindows'}
    UpdateChangeWindowsWrite: {$ref: './platform/update-agent.yaml#/components/schemas/ChangeWindowsWrite'}
    UpdateUpcomingWindow: {$ref: './platform/update-agent.yaml#/components/schemas/UpcomingWindow'}
    UpdateChangePolicy: {$ref: './platform/update-agent.yaml#/components/schemas/ChangePolicy'}
    UpdateConnectionPatch:
      description: Only the fields sent change.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        mode: {$ref: './platform/update-agent.yaml#/components/schemas/ConnectionMode'}
        proxy:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            enabled: {type: boolean}
            address: {type: [string, 'null'], maxLength: 300, description: Null or blank clears it. Required while the proxy is enabled.}
            username: {type: [string, 'null'], maxLength: 120, description: Null or blank clears it.}
            password: {type: string, format: password, writeOnly: true, maxLength: 512, description: An empty string clears it; omit it to keep the stored one.}
            ca_certificate_pem: {type: string, writeOnly: true, maxLength: 20000, description: An empty string clears it; omit it to keep the stored one.}
    UpdateChangeWindowsPatch:
      description: Only what is sent changes.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        recurring_window:
          type: object
          additionalProperties: false
          properties:
            id: {$ref: '#/components/schemas/Uuid', description: 'The window to change. Without it a window is added, and days_of_week, start_time and end_time are required.'}
            label: {type: string, minLength: 1, maxLength: 120, description: Omit it to have the server write it from the days and times.}
            days_of_week: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 6}, description: 0 = Sunday. Time zone Asia/Riyadh.}
            start_time: {$ref: '#/components/schemas/LocalTime'}
            end_time: {$ref: '#/components/schemas/LocalTime'}
        add_blackouts:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [label, entered_as]
            properties:
              label: {type: string, minLength: 1, maxLength: 120}
              entered_as: {type: string, enum: [hijri, gregorian]}
              start_gregorian: {type: string, format: date}
              end_gregorian: {type: string, format: date}
              start_hijri: {$ref: './platform/update-agent.yaml#/components/schemas/HijriDate'}
              end_hijri: {$ref: './platform/update-agent.yaml#/components/schemas/HijriDate'}
        remove_blackout_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
          description: An id that is not stored is ignored.
    UpdateChangePolicyPatch:
      description: Only the fields sent change.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        approver_user_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        second_approver_required: {type: boolean}
        emergency_override_enabled: {type: boolean}
        emergency_reason_min_length: {type: integer, minimum: 20, maximum: 1000}
    UpdateBackupConfirmation:
      type: object
      additionalProperties: false
      properties:
        note: {type: [string, 'null'], maxLength: 300}
    UpdateScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        window_start: {$ref: '#/components/schemas/Timestamp', description: Omit to use the next open change window.}
    UpdateSkipRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300}
    UpdateEmergencyOverrideRequest:
      description: A hotfix outside a change window needs two different approvers and a written reason. The caller is the first approver; the second is named here (assumption on the stub's approval detail). Flagged in the Audit Log.
      type: object
      additionalProperties: false
      required: [version, second_approver_user_id, reason]
      properties:
        version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', maxLength: 32}
        second_approver_user_id: {$ref: '#/components/schemas/Uuid'}
        reason: {type: string, minLength: 20, maxLength: 1000}
    UpdateRecoveryRequest:
      description: rollback returns to the recorded previous version. resume continues a partly failed migration after a fixed release. restore records a request that the customer's database team carries out.
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [rollback, resume, restore]}
        run_id: {$ref: '#/components/schemas/NullableUuid'}
        note: {type: [string, 'null'], maxLength: 500}
    UpdateRecoveryStatus:
      description: 'OpenDispatch contract only (the update agent stub has no read for a restore request; the real agent needs one). The latest restore request that a resume did not overtake, with the run and the release it belongs to, so the Updates screen can show it again after a reload. Every field is null when there is no such request, and a completed request is history (every field null) once another run has started. A restore request is carried out by the customer''s database team: requested, in_progress, completed. In the scripted agent (a stub) it moves on with time.'
      type: object
      additionalProperties: false
      required: [restore_request, run_id, version, note, completed_at]
      properties:
        restore_request: {oneOf: [{$ref: '#/components/schemas/UpdateRestoreRequest'}, {type: 'null'}]}
        run_id: {$ref: '#/components/schemas/NullableUuid', description: The run that needed attention when the restore was requested.}
        version: {type: [string, 'null'], pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', maxLength: 32, description: The release whose update failed partway.}
        note: {type: [string, 'null'], maxLength: 500, description: The note the Administrator gave with the request.}
        completed_at: {$ref: '#/components/schemas/NullableTimestamp'}
      examples:
        - {restore_request: null, run_id: null, version: null, note: null, completed_at: null}
    UpdateOfflineUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, contentMediaType: application/octet-stream, description: The signed offline update file downloaded from the customer portal.}
    UserDisplayNames:
      description: The display names of the users whose ids were asked for. Ids that match no user are left out.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, display_name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              display_name: {type: string, minLength: 1, maxLength: 120}
              role: {description: 'The role the person holds; absent from older servers.', $ref: '#/components/schemas/RoleId'}
    SupportAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [hours, reason]
      properties:
        hours: {type: integer, minimum: 1, maximum: 72, description: 'At most the longest grant of the support-access setting (max_duration_hours).'}
        reason: {type: string, minLength: 1, maxLength: 500}
    IdentityProviderChangeRequest:
      type: object
      additionalProperties: false
      required: [change]
      properties:
        provider_id: {type: [string, 'null'], maxLength: 128, description: 'The provider the change is about; null for a new provider.'}
        change: {type: string, minLength: 1, maxLength: 1000, description: 'What should change, in the requester''s words.'}
    IdentityProviderChangeReceipt:
      type: object
      additionalProperties: false
      required: [requested_at, reference_code]
      properties:
        requested_at: {$ref: '#/components/schemas/Timestamp'}
        reference_code: {type: string, maxLength: 32, description: 'Quote it when talking to support.'}
    MaintenanceModeUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    SkillCreate:
      type: object
      additionalProperties: false
      required: [code, name_en]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: 'Lower case letters, digits and underscores.'}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
    SkillUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
    SkillVocabularyEntry:
      type: object
      additionalProperties: false
      required: [code, name_en, name_ar]
      properties:
        code: {type: string, maxLength: 64}
        name_en: {type: string, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
    QuietHours:
      description: A daily window in Riyadh time in which notifications are held. Stored, not applied in demo mode. `start` and `end` differ; the window may cross midnight. Critical alerts are never held.
      type: object
      additionalProperties: false
      required: [enabled, start, end, applies_to]
      properties:
        enabled: {type: boolean}
        start: {$ref: '#/components/schemas/LocalTime'}
        end: {$ref: '#/components/schemas/LocalTime'}
        applies_to: {type: string, enum: [email, email_and_in_app]}
    ApiRateLimits:
      description: Requests per minute and burst for each API scope. Stored, not enforced in demo mode. Exactly one entry for each of read, write and feeds.
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [scope, requests_per_minute, burst]
            properties:
              scope: {type: string, enum: [read, write, feeds]}
              requests_per_minute: {type: integer, minimum: 1, maximum: 100000}
              burst: {type: integer, minimum: 1, maximum: 10000}
    WebhookDeliveryRetryResult:
      type: object
      additionalProperties: false
      required: [delivery, delivered, message]
      properties:
        delivery: {$ref: '#/components/schemas/WebhookDelivery'}
        delivered: {type: boolean}
        message: {type: string, maxLength: 300, description: 'in demo mode it ends with "(stub: nothing was sent)".'}
    LocationImportRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, minLength: 1, maxLength: 5000000, contentMediaType: text/csv, description: 'The text of the CSV file, read by the client.'}
    LocationImportResult:
      type: object
      additionalProperties: false
      required: [cities, zones, sub_zones, standby_points, total]
      properties:
        cities: {type: integer, minimum: 0}
        zones: {type: integer, minimum: 0}
        sub_zones: {type: integer, minimum: 0}
        standby_points: {type: integer, minimum: 0}
        total: {type: integer, minimum: 1}
    AgentImportRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, minLength: 1, maxLength: 2000000, contentMediaType: text/csv, description: 'The text of the CSV file, read by the client.'}
    AgentImportResult:
      type: object
      additionalProperties: false
      required: [agents, skills]
      properties:
        agents: {type: integer, minimum: 1}
        skills: {type: integer, minimum: 0, description: The number of skill entries created for the new agents.}
