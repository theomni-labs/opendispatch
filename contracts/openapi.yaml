            scope_id: {$ref: '#/components/schemas/NullableUuid', description: 'Zone or city id; null for kingdom.'}
            period_start: {$ref: '#/components/schemas/LocalDate'}
            period_end: {$ref: '#/components/schemas/LocalDate'}
            cases_total: {type: integer, minimum: 0}
            cases_field: {type: integer, minimum: 0}
            cases_remote_inferred: {type: integer, minimum: 0}
            forecast_expected_total: {type: [number, 'null'], minimum: 0}
            from_registration: {$ref: '#/components/schemas/ServiceLevelReading'}
            from_assignment: {$ref: '#/components/schemas/ServiceLevelReading'}
            primary_clock_start: {$ref: '#/components/schemas/ClockStart'}
            agents_on_duty: {type: [integer, 'null'], minimum: 0}
            gap_intervals: {type: [integer, 'null'], minimum: 0}
            surplus_intervals: {type: [integer, 'null'], minimum: 0}
            illustrative: {type: boolean}
      unevaluatedProperties: false
    ProductivityRollup:
      description: Time to scene and time on scene per agent or zone. A roll-up table with tenant_id.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [group_by, zone_id, agent_id, period_start, period_end, cases_handled, illustrative]
          properties:
            group_by: {type: string, enum: [agent, zone]}
            zone_id: {$ref: '#/components/schemas/NullableUuid'}
            agent_id: {$ref: '#/components/schemas/NullableUuid'}
            period_start: {$ref: '#/components/schemas/LocalDate'}
            period_end: {$ref: '#/components/schemas/LocalDate'}
            cases_handled: {type: integer, minimum: 0}
            median_assigned_to_arrived_seconds: {type: [number, 'null'], minimum: 0}
            median_registered_to_arrived_seconds: {type: [number, 'null'], minimum: 0}
            median_time_on_scene_seconds: {type: [number, 'null'], minimum: 0}
            utilisation: {type: [number, 'null'], minimum: 0, maximum: 1}
            illustrative: {type: boolean}
      unevaluatedProperties: false
    OverCapacityReport:
      description: Contiguous surplus windows per zone over a period (getOverCapacity).
      type: object
      additionalProperties: false
      required: [date_from, date_to, zones, illustrative, data_source]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, window_count, longest_minutes, peak_surplus, surplus_agent_hours, windows]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              window_count: {type: integer, minimum: 0}
              longest_minutes: {type: integer, minimum: 0}
              peak_surplus: {type: integer, minimum: 0, description: 'Most agents over required in one interval.'}
              surplus_agent_hours: {type: number, minimum: 0, description: 'Sum over intervals of surplus agents x 0.25 h.'}
              gap_intervals: {type: integer, minimum: 0, description: 'Optional. 15-minute intervals of the period where the gap view is a gap.'}
              short_agent_hours: {type: number, minimum: 0, description: 'Optional. Sum over gap intervals of missing agents x 0.25 h.'}
              windows:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [start_at, end_at, minutes, peak_surplus, surplus_agent_hours]
                  properties:
                    start_at: {$ref: '#/components/schemas/Timestamp'}
                    end_at: {$ref: '#/components/schemas/Timestamp'}
                    minutes: {type: integer, minimum: 15}
                    peak_surplus: {type: integer, minimum: 1}
                    surplus_agent_hours: {type: number, minimum: 0}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    OverrideRateRow:
      type: object
      additionalProperties: false
      required: [zone_id, assignments, overridden, share]
      properties:
        zone_id: {$ref: '#/components/schemas/NullableUuid', description: 'Null on the total.'}
        assignments: {type: integer, minimum: 0}
        overridden: {type: integer, minimum: 0}
        share: {type: [number, 'null'], minimum: 0, description: 'overridden / assignments; null with no assignments.'}
    OverrideRateReport:
      description: Overridden share of roster assignments per zone over a period (getOverrideRate).
      type: object
      additionalProperties: false
      required: [date_from, date_to, target_share, zones, total, illustrative, data_source]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        target_share: {type: number, exclusiveMinimum: 0, maximum: 1}
        zones: {type: array, items: {$ref: '#/components/schemas/OverrideRateRow'}}
        total: {$ref: '#/components/schemas/OverrideRateRow'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    UtilizationReport:
      description: Worked field case-hours over available agent-hours per zone and shift (getUtilization).
      type: object
      additionalProperties: false
      required: [date_from, date_to, zones, illustrative, data_source]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        worked_hours: {type: number, minimum: 0, description: 'Optional. All zones of the report.'}
        available_hours: {type: number, minimum: 0, description: 'Optional. All zones of the report.'}
        share: {type: [number, 'null'], minimum: 0, description: 'Optional. worked / available over all zones of the report.'}
        change_points: {$ref: '#/components/schemas/UtilizationChangePoints'}
        baseline: {$ref: '#/components/schemas/UtilizationBaseline'}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, worked_hours, available_hours, share, rostered_days, projected_days, shifts]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              worked_hours: {type: number, minimum: 0}
              available_hours: {type: number, minimum: 0}
              share: {type: [number, 'null'], minimum: 0, description: 'worked / available; null with no available hours. May exceed 1.'}
              rostered_days: {type: integer, minimum: 0}
              projected_days: {type: integer, minimum: 0, description: 'Days with no roster, counted from home shifts.'}
              cases: {type: integer, minimum: 0, description: 'Optional. Field cases with a worked span in the period.'}
              agent_shifts: {type: integer, minimum: 0, description: 'Optional. Lines on duty (one agent, one shift, one day).'}
              cases_per_agent_shift: {type: [number, 'null'], minimum: 0, description: 'Optional. cases / agent_shifts; null with no shifts.'}
              baseline_share: {type: [number, 'null'], minimum: 0, description: 'Optional. The same zone''s share in the baseline.'}
              change_points: {$ref: '#/components/schemas/UtilizationChangePoints'}
              shifts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [shift_pattern_id, code, worked_hours, available_hours, share]
                  properties:
                    shift_pattern_id: {$ref: '#/components/schemas/Uuid'}
                    code: {type: string}
                    worked_hours: {type: number, minimum: 0}
                    available_hours: {type: number, minimum: 0}
                    share: {type: [number, 'null'], minimum: 0}
                    cases: {type: integer, minimum: 0, description: 'Optional. Cases whose agent had a line of this shift covering assigned_at.'}
                    agent_shifts: {type: integer, minimum: 0, description: 'Optional.'}
                    cases_per_agent_shift: {type: [number, 'null'], minimum: 0, description: 'Optional.'}
                    baseline_share: {type: [number, 'null'], minimum: 0, description: 'Optional. The same zone and shift in the baseline.'}
                    change_points: {$ref: '#/components/schemas/UtilizationChangePoints'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    UtilizationChangePoints:
      description: 'Optional. (share - baseline share) x 100, one decimal: the spec 8 measure, up at least target_points. Null when either share is null.'
      type: [number, 'null']
    UtilizationBaseline:
      description: 'Optional. What utilization is compared with. Setting kpi.utilization_baseline: {method: period, date_from, date_to} (a captured period of at most 31 days, measured as the report is) or {method: value, share} (an imported company figure, for every zone and shift). Unset: the first 28 days of stored field cases with a worked span. none: no history to measure. Target kpi.utilization_target_points (default 10). Illustrative on synthetic data.'
      type: object
      additionalProperties: false
      required: [method, date_from, date_to, share, target_points, from_setting]
      properties:
        method: {type: string, enum: [period, value, none]}
        date_from: {type: [string, 'null'], format: date}
        date_to: {type: [string, 'null'], format: date}
        share: {type: [number, 'null'], minimum: 0, description: 'Baseline share over the report''s zones.'}
        target_points: {type: number, exclusiveMinimum: 0, maximum: 100}
        from_setting: {type: boolean}
    ScheduleAdherenceReport:
      description: 'Planned against actual on duty (spec 5 schedule adherence; getScheduleAdherence). Planned: the roster in force for each zone and date, else the home shifts (as getUtilization). Actual: attendance spans (time and attendance) of the planned agents. A line counts in each 15-minute interval whose start it covers; actual when one of the agent''s spans covers it too. Without attendance for a zone its actual figures are null. Illustrative.'
      type: object
      additionalProperties: false
      required: [date_from, date_to, interval_minutes, planned_agent_hours, actual_agent_hours, share, intervals, zones, illustrative, data_source]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        interval_minutes: {type: integer, const: 15}
        planned_agent_hours: {type: number, minimum: 0}
        actual_agent_hours: {type: [number, 'null'], minimum: 0}
        share: {type: [number, 'null'], minimum: 0, maximum: 1, description: 'actual / planned agent-hours.'}
        intervals:
          description: '96 intervals of the Riyadh day (a night line counts in the morning it reaches), agents on duty, mean over the period''s days, all zones of the report.'
          type: array
          minItems: 96
          maxItems: 96
          items:
            type: object
            additionalProperties: false
            required: [interval_index, planned, actual]
            properties:
              interval_index: {type: integer, minimum: 0, maximum: 95}
              planned: {type: number, minimum: 0}
              actual: {type: [number, 'null'], minimum: 0}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, planned_agent_hours, actual_agent_hours, share, planned_shifts, absent_shifts, late_starts, has_actuals]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              planned_agent_hours: {type: number, minimum: 0}
              actual_agent_hours: {type: [number, 'null'], minimum: 0}
              share: {type: [number, 'null'], minimum: 0, maximum: 1}
              planned_shifts: {type: integer, minimum: 0}
              absent_shifts: {type: [integer, 'null'], minimum: 0, description: 'Planned lines with no attendance at all.'}
              late_starts: {type: [integer, 'null'], minimum: 0, description: 'Planned lines whose first interval on duty is after their first.'}
              has_actuals: {type: boolean}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ProductivityDurations:
      description: Field case durations for a period, summarised in the database. Histograms have 16 bins of bucket_seconds; the last is everything from 30 minutes; a negative duration counts in the first.
      type: object
      additionalProperties: false
      required: [date_from, date_to, bucket_seconds, overall, zones, cells, days, data_sources]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        bucket_seconds: {type: integer, const: 120}
        overall: {$ref: '#/components/schemas/DurationSummary'}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, summary]
            properties:
              zone_id: {$ref: '#/components/schemas/NullableUuid'}
              summary: {$ref: '#/components/schemas/DurationSummary'}
        cells:
          description: Per zone and 4-hour block of the Riyadh hour of assigned_at.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, block_start_hour, cases, median_from_assignment_seconds]
            properties:
              zone_id: {$ref: '#/components/schemas/NullableUuid'}
              block_start_hour: {type: integer, enum: [0, 4, 8, 12, 16, 20]}
              cases: {type: integer, minimum: 1}
              median_from_assignment_seconds: {type: number}
              median_from_registration_seconds: {type: number, description: 'The same cases measured from registration; absent from older servers.'}
        days:
          description: The asked agent's field cases per Riyadh registration date; medians over the cases with every duration. Empty without agent_id.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, cases, median_from_assignment_seconds, median_on_scene_seconds]
            properties:
              date: {$ref: '#/components/schemas/LocalDate'}
              cases: {type: integer, minimum: 1}
              median_from_assignment_seconds: {type: [number, 'null']}
              median_on_scene_seconds: {type: [number, 'null']}
        data_sources: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/DataSource'}}
    DurationSummary:
      type: object
      additionalProperties: false
      required: [cases, from_assignment, from_registration, on_scene]
      properties:
        cases: {type: integer, minimum: 0, description: Cases with every duration.}
        from_assignment: {$ref: '#/components/schemas/DurationDistribution'}
        from_registration: {$ref: '#/components/schemas/DurationDistribution'}
        on_scene: {$ref: '#/components/schemas/DurationDistribution'}
        admin: {$ref: '#/components/schemas/DurationDistribution', description: 'Optional. Post-scene admin time, closed_at less on_scene_completed_at, over the cases that also have closed_at at or after on-scene completion.'}
    DurationDistribution:
      type: object
      additionalProperties: false
      required: [median_seconds, histogram]
      properties:
        median_seconds: {type: [number, 'null']}
        histogram: {type: array, minItems: 16, maxItems: 16, items: {type: integer, minimum: 0}}
    # ---- Session, settings, platform ----
    ModuleAccess:
      type: object
      additionalProperties: false
      required: [module_id, access, can_approve]
      properties:
        module_id: {type: string, maxLength: 64, description: One of the ids in x-modules.}
        access: {type: string, enum: [none, view, edit]}
        can_approve: {type: boolean}
    SessionContext:
      description: What the server knows about the caller. Built on the server, never sent by the client.
      type: object
      additionalProperties: false
      required: [user, tenant, install_mode, is_demo, modules]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, display_name, email, assigned_role, zone_ids, preferred_locale]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            display_name: {type: string, maxLength: 120}
            email: {type: string, format: email, maxLength: 254}
            assigned_role: {$ref: '#/components/schemas/RoleId'}
            zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
            preferred_locale: {$ref: '#/components/schemas/Locale'}
        tenant:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            display_name: {type: string, maxLength: 120}
        install_mode: {$ref: '#/components/schemas/InstallMode'}
        is_demo: {type: boolean, description: True in demo mode. Screens show a demo marker.}
        modules: {type: array, items: {$ref: '#/components/schemas/ModuleAccess'}}
    LocalizationSettings:
      type: object
      additionalProperties: false
      required: [default_locale, digit_system, primary_calendar, show_secondary_calendar, time_zone, first_day_of_week]
      properties:
        default_locale: {$ref: '#/components/schemas/Locale'}
        digit_system: {type: string, enum: [western, arabic_indic], default: western, description: 'Decision: Western digits in both languages.'}
        primary_calendar: {type: string, enum: [gregorian, hijri]}
        show_secondary_calendar: {type: boolean}
        time_zone: {const: Asia/Riyadh}
        first_day_of_week: {type: string, enum: [saturday, sunday, monday]}
    SettingsSnapshot:
      description: The settings every screen needs, typed. Writes go through the owning module's operation.
      type: object
      additionalProperties: false
      required: [clock_start, planning_level, live_assignment_stages, fallback_timeout_seconds, localization, install_mode, updated_at]
      properties:
        clock_start: {$ref: '#/components/schemas/ClockStart', description: Primary 10-minute reading. Default assignment. Both readings are always shown.}
        planning_level: {$ref: '#/components/schemas/PlanningLevel'}
        live_assignment_stages: {type: array, items: {$ref: '#/components/schemas/ZoneStage'}}
        fallback_timeout_seconds: {type: integer, minimum: 1, maximum: 300}
        decision_deadline_ms: {type: integer, minimum: 50, maximum: 30000}
        dispatch_auto_resume: {type: boolean, description: 'Optional. Setting dispatch.auto_resume, default false: after OpenDispatch signalled fallback by itself, it sends resume by itself once the cause has cleared for dispatch_auto_resume_after_seconds. False: a person resumes.'}
        dispatch_auto_resume_after_seconds: {type: integer, minimum: 30, maximum: 3600, description: 'Optional. Default 120.'}
        dispatch_reposition: {type: boolean, description: 'Optional. Setting dispatch.reposition, default false: OpenDispatch suggests waiting spots for idle field agents (advisory, never an assignment).'}
        dispatch_reposition_max_move_km: {type: number, exclusiveMinimum: 0, maximum: 50, description: 'Optional. Setting dispatch.reposition_max_move_km, default 5: the longest suggested idle drive (a cap on idle driving).'}
        dispatch_prayer_penalty: {type: boolean, description: 'Optional. Setting dispatch.prayer_penalty, default false.'}
        dispatch_fallback_after_silence_seconds: {type: integer, minimum: 5, maximum: 3600, description: 'Optional. Setting dispatch.fallback_after_silence_seconds, default 120 (the api may set another default): OpenDispatch signals fallback when neither the case feed nor the agent feed has sent an event for this long. Separate from the 15-minute feed Down health label.'}
        localization: {$ref: '#/components/schemas/LocalizationSettings'}
        install_mode: {$ref: '#/components/schemas/InstallMode'}
        service_level_target_share: {type: number, exclusiveMinimum: 0, maximum: 1, description: 'Optional. Setting service_level.target_share, default 0.95: the share of field cases to reach within the 10-minute threshold.'}
        optimizer_model: {$ref: '#/components/schemas/OptimizerModel'}
        optimizer_models: {type: array, items: {$ref: '#/components/schemas/OptimizerModel'}, description: 'Optional. The models the optimizer engine accepts, default first.'}
        break_prayer_policy: {$ref: '#/components/schemas/BreakPrayerPolicy'}
        prayer_window_minutes: {type: integer, minimum: 5, maximum: 90, description: 'Optional. Setting breaks.prayer_window_minutes, default 30: how long a prayer blocks work after the adhan.'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        remote_handling_source: {$ref: '#/components/schemas/RemoteHandlingSource', description: 'Optional. Setting remote.handling_source, default measured.'}
        remote_handling_fixed_minutes: {type: number, minimum: 5, maximum: 240, description: 'Optional. Setting remote.handling_fixed_minutes, default 31.5: the fallback minutes per remote case.'}
        ten_minute_threshold_seconds: {type: integer, minimum: 60, maximum: 3600, description: 'Optional. The service-level reach threshold in seconds, default 600; screens read it instead of inferring it.'}
    ClockStartUpdate:
      type: object
      additionalProperties: false
      required: [clock_start]
      properties:
        clock_start: {$ref: '#/components/schemas/ClockStart'}
    PlanningLevelUpdate:
      type: object
      additionalProperties: false
      required: [planning_level]
      properties:
        planning_level: {$ref: '#/components/schemas/PlanningLevel'}
    OptimizerModel:
      type: string
      enum: [greedy-ls-0.3, cpsat-1, greedy-ls-0.2, greedy-ls-0.1]
      description: 'Optional. Setting planning.optimizer_model, default cpsat-1: the optimizer model each request asks for.'
    BreakPrayerPolicy:
      type: string
      enum: [clear_of_prayer, lined_up_with_prayer]
      description: 'Optional. Setting breaks.prayer_policy, default clear_of_prayer: a break never overlaps a prayer window. lined_up_with_prayer: a break that can covers a whole prayer window.'
    BreakPrayerUpdate:
      type: object
      additionalProperties: false
      properties:
        prayer_policy: {$ref: '#/components/schemas/BreakPrayerPolicy'}
        prayer_window_minutes: {type: integer, minimum: 5, maximum: 90}
    OptimizerModelUpdate:
      type: object
      additionalProperties: false
      required: [optimizer_model]
      properties:
        optimizer_model: {$ref: '#/components/schemas/OptimizerModel'}
    LiveAssignmentSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        fallback_timeout_seconds: {type: integer, minimum: 1, maximum: 300}
        decision_deadline_ms: {type: integer, minimum: 50, maximum: 30000}
        dispatch_auto_resume: {type: boolean}
        dispatch_auto_resume_after_seconds: {type: integer, minimum: 30, maximum: 3600}
        dispatch_fallback_after_silence_seconds: {type: integer, minimum: 5, maximum: 3600}
        dispatch_reposition: {type: boolean}
        dispatch_reposition_max_move_km: {type: number, exclusiveMinimum: 0, maximum: 50}
        dispatch_prayer_penalty: {type: boolean}
        ten_minute_threshold_seconds: {type: integer, minimum: 60, maximum: 3600}
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded, down]}
        version: {type: string, maxLength: 64}
    DemoOptions:
      description: Demo only. What the demo switcher offers; names only, no personal data.
      type: object
      additionalProperties: false
      required: [customer_name, customer_id, zones, install_modes, roles_by_install_mode]
      properties:
        customer_name: {type: string, maxLength: 200}
        customer_name_ar: {type: string, maxLength: 200, description: The customer name on Arabic pages; customer_name when absent.}
        customer_id: {$ref: '#/components/schemas/Uuid'}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, city_name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              name: {type: string, maxLength: 200}
              city_name: {type: string, maxLength: 200}
        install_modes: {type: array, items: {$ref: '#/components/schemas/InstallMode'}}
        roles_by_install_mode:
          type: object
          additionalProperties: false
          required: [private, dedicated, shared]
          properties:
            private: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
            dedicated: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
            shared: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
    DemoSignInRequest:
      description: Demo only. What the demo switcher submits. Zones count only for roles scoped to assigned zones.
      type: object
      additionalProperties: false
      required: [assigned_role, install_mode, zone_ids]
      properties:
        assigned_role: {$ref: '#/components/schemas/RoleId'}
        install_mode: {$ref: '#/components/schemas/InstallMode'}
        zone_ids: {type: array, uniqueItems: true, maxItems: 64, items: {$ref: '#/components/schemas/Uuid'}}
    DemoResetResult:
      description: Demo only. Clears the local demo store; fixtures are untouched.
      type: object
      additionalProperties: false
      required: [reset_at, cleared]
      properties:
        reset_at: {$ref: '#/components/schemas/Timestamp'}
        cleared: {type: boolean}
    # ---- Users and identity ----
    Role:
      type: object
      additionalProperties: false
      required: [id, name_en, name_ar, scope, available_in]
      properties:
        id: {$ref: '#/components/schemas/RoleId'}
        name_en: {type: string, maxLength: 60}
        name_ar: {type: string, maxLength: 60}
        scope: {type: string, enum: [whole_install, assigned_zones, remote_pool]}
        available_in: {type: array, items: {$ref: '#/components/schemas/InstallMode'}, description: Change Approver exists only in private installs.}
    EffectiveAccess:
      type: object
      additionalProperties: false
      required: [user_id, assigned_role, scope, zone_ids, modules]
      properties:
        user_id: {$ref: '#/components/schemas/Uuid'}
        assigned_role: {$ref: '#/components/schemas/RoleId'}
        scope: {type: string, enum: [whole_install, assigned_zones, remote_pool]}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        modules: {type: array, items: {$ref: '#/components/schemas/ModuleAccess'}}
    IdentityProviderPreset:
      description: A preset that fills in the usual settings for a provider. Entra ID presets tell the customer to send only groups assigned to the application (150 or 200 group limit) and map groups by object ID.
      type: object
      additionalProperties: false
      required: [id, name_en, protocol, fields, default_claims, notes_en]
      properties:
        id: {type: string, enum: [entra_id_oidc, entra_id_saml, adfs_saml, adfs_oidc, okta, google_workspace, ping_identity, generic_oidc, generic_saml]}
        name_en: {type: string, maxLength: 80}
        protocol: {type: string, enum: [oidc, saml]}
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, label_en, required, secret]
            properties:
              key: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 64}
              label_en: {type: string, maxLength: 80}
              required: {type: boolean}
              secret: {type: boolean}
              placeholder: {type: [string, 'null'], maxLength: 120}
        default_claims: {$ref: '#/components/schemas/ClaimMapping'}
        notes_en: {type: array, items: {type: string, maxLength: 200}}
    ClaimMapping:
      description: Which token fields hold email, name and groups.
      type: object
      additionalProperties: false
      required: [email, name, groups]
      properties:
        email: {type: string, maxLength: 128}
        name: {type: string, maxLength: 128}
        groups: {type: string, maxLength: 128}
    IdentityProvider:
      description: Stored in Keycloak, not in OpenDispatch's database, so it has no tenant_id here. The api reads and changes it through Keycloak's admin interface. Signed SAML assertions are always required. Client secrets are never returned.
      type: object
      additionalProperties: false
      required: [id, preset_id, display_name, protocol, is_enabled, email_domains, claim_mapping, has_secret, signed_assertions_required, data_source]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, description: Keycloak alias.}
        preset_id: {type: string, maxLength: 64}
        display_name: {type: string, minLength: 1, maxLength: 120}
        protocol: {type: string, enum: [oidc, saml]}
        is_enabled: {type: boolean}
        email_domains: {type: array, uniqueItems: true, items: {type: string, maxLength: 253}}
        config: {type: object, additionalProperties: {type: string, maxLength: 8192}, description: Non-secret settings only.}
        claim_mapping: {$ref: '#/components/schemas/ClaimMapping'}
        has_secret: {type: boolean}
        signed_assertions_required: {const: true}
        last_test_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_test_ok: {type: [boolean, 'null']}
        read_only: {type: boolean, description: 'True in the shared tier, where our staff manage providers from the Operator Console.'}
        data_source: {$ref: '#/components/schemas/DataSource'}
        sync_status: {type: string, enum: [synced, failed, not_configured], description: 'Keycloak state of this provider. synced: Keycloak has it as last saved. failed: the last change did not reach Keycloak; last_sync_error says why. not_configured: Keycloak admin access is not set up, so the provider is stored only. Absent on the demo mock provider.'}
        last_sync_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_sync_error: {type: [string, 'null'], maxLength: 300, description: 'Why the last sync with Keycloak failed. Never contains a secret.'}
    IdentityProviderWrite:
      type: object
      additionalProperties: false
      required: [preset_id, display_name, is_enabled]
      properties:
        preset_id: {type: string, maxLength: 64}
        display_name: {type: string, minLength: 1, maxLength: 120}
        is_enabled: {type: boolean}
        email_domains: {type: array, uniqueItems: true, items: {type: string, maxLength: 253}}
        config: {type: object, additionalProperties: {type: string, maxLength: 8192}}
        client_secret: {type: string, format: password, writeOnly: true, maxLength: 512}
        claim_mapping: {$ref: '#/components/schemas/ClaimMapping'}
    ConnectionTestResult:
      type: object
      additionalProperties: false
      required: [ok, checked_at, steps]
      properties:
        ok: {type: boolean}
        checked_at: {$ref: '#/components/schemas/Timestamp'}
        reference_code: {type: [string, 'null'], maxLength: 32}
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, ok]
            properties:
              name: {type: string, maxLength: 80, description: 'English text. Screens translate from `code` when it is present.'}
              code: {type: string, enum: [keycloak, reach, discovery, client, claims, saml, signed, attrs], description: 'Which check this is: keycloak (the provider and its mappers are set up in Keycloak; only when Keycloak is connected), then the OIDC steps reach, discovery, client, claims or the SAML steps reach, saml, signed, attrs. With Keycloak connected, reach and discovery or saml mean Keycloak itself fetched the provider''s metadata.'}
              ok: {type: boolean}
              message: {type: [string, 'null'], maxLength: 300}
    RoleMappingPreviewRequest:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        identity_provider_id: {type: [string, 'null'], maxLength: 128}
        groups: {type: array, maxItems: 200, items: {type: string, maxLength: 256}}
    RoleMappingPreview:
      description: 'What a person with these groups would get. No matching rule means no access: assigned_role is null.'
      type: object
      additionalProperties: false
      required: [assigned_role, zone_ids, matched_mapping_ids]
      properties:
        assigned_role: {type: [string, 'null'], enum: [administrator, dispatch_supervisor, dispatcher, planner, remote_team_lead, viewer_auditor, change_approver, null]}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        matched_mapping_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
    SignInPolicy:
      description: Keycloak-side. Session length lives in SessionPolicy (Admin 14) and is shown on the sign-in policy screen from there (assumption).
      type: object
      additionalProperties: false
      required: [force_sso_email_domains, require_mfa_claim, allow_local_users_for_outsiders, emergency_admin_enabled]
      properties:
        force_sso_email_domains: {type: array, uniqueItems: true, items: {type: string, maxLength: 253}}
        require_mfa_claim: {type: boolean, default: false, description: Refuse sign-ins whose token does not show that MFA was used.}
        allow_local_users_for_outsiders: {type: boolean, default: false, description: Off by default.}
        emergency_admin_enabled: {type: boolean}
    MockSignInRequest:
      description: Demo only. Signs in through the labelled mock provider. The groups are the claims the mock provider asserts; the role comes from the group rules on the server.
      type: object
      additionalProperties: false
      required: [provider_id, subject, groups]
      properties:
        provider_id: {type: string, maxLength: 128}
        subject: {type: string, minLength: 1, maxLength: 128}
        groups: {type: array, maxItems: 200, items: {type: string, maxLength: 256}}
    SignInResult:
      type: object
      additionalProperties: false
      required: [outcome, is_mock]
      properties:
        outcome: {type: string, enum: [signed_in, mfa_required, invalid_credentials, locked, refused_by_provider, no_role_assigned, error]}
        is_mock: {type: boolean, description: True for the labelled mock provider.}
        user_id: {$ref: '#/components/schemas/NullableUuid'}
        assigned_role: {type: [string, 'null'], enum: [administrator, dispatch_supervisor, dispatcher, planner, remote_team_lead, viewer_auditor, change_approver, null]}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        reference_code: {type: [string, 'null'], maxLength: 32, description: Shown on the something-went-wrong screen.}
    EmergencySignInRequest:
      description: Local emergency-admin sign-in. Password is stored as a one-way hash; MFA is enforced by OpenDispatch. Every use raises an alert and an audit event.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, writeOnly: true, minLength: 1, maxLength: 256}
        totp_code: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    EmergencyAdminResetResult:
      type: object
      additionalProperties: false
      required: [reset_at, reset_kind]
      properties:
        reset_at: {$ref: '#/components/schemas/Timestamp'}
        reset_kind: {type: string, enum: [password, mfa]}
        temporary_secret_hint: {type: [string, 'null'], maxLength: 8, description: Last characters only. The full temporary secret is delivered out of band.}
    # ---- Forecast and model admin ----
    ModelVersion:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [version, status, is_placeholder]
          properties:
            version: {type: string, minLength: 1, maxLength: 64}
            status: {type: string, enum: [candidate, active, retired]}
            is_placeholder: {type: boolean, description: True until the real forecaster replaces the placeholder.}
            engine_version: {type: [string, 'null'], maxLength: 64}
            trained_at: {$ref: '#/components/schemas/NullableTimestamp'}
            notes_en: {type: [string, 'null'], maxLength: 500}
            dataset_snapshot_id: {type: [string, 'null'], maxLength: 64, description: 'The dataset snapshot of the newest succeeded forecast run of this version; absent when it has none.'}
      unevaluatedProperties: false
    RetrainingSchedule:
      type: object
      additionalProperties: false
      required: [cadence, time_of_day]
      properties:
        cadence: {type: string, enum: [manual, daily, weekly, monthly]}
        day_of_week: {type: [integer, 'null'], minimum: 0, maximum: 6, description: '0 = Sunday. For weekly.'}
        time_of_day: {$ref: '#/components/schemas/LocalTime'}
    ModelState:
      type: object
      additionalProperties: false
      required: [active_version, is_paused, retraining_schedule, data_source]
      properties:
        active_version: {type: string, maxLength: 64}
        is_paused: {type: boolean}
        paused_at: {$ref: '#/components/schemas/NullableTimestamp'}
        paused_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
        pause_reason: {type: [string, 'null'], maxLength: 300}
        retraining_schedule: {$ref: '#/components/schemas/RetrainingSchedule'}
        last_forecast_run_id: {$ref: '#/components/schemas/NullableUuid'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    WorkingAssumptions:
      description: The working assumptions shown to the customer. Each comes from a setting or from the one place in code that holds it.
      type: object
      additionalProperties: false
      required: [live_travel_speed_kmh, planning_travel_speed_kmh, clock_start, clock_start_confirmed, payday_day, handling_inferred, case_data_sources, weather]
      properties:
        live_travel_speed_kmh: {type: number, exclusiveMinimum: 0, maximum: 200, description: 'Straight-line speed of the live assignment ranking.'}
        planning_travel_speed_kmh: {type: number, exclusiveMinimum: 0, maximum: 200, description: 'Setting travel_model.average_speed_kmh (planner, optimizer, simulator).'}
        clock_start: {$ref: '#/components/schemas/ClockStart'}
        clock_start_confirmed: {type: boolean, description: 'True when clock_start is the start the customer confirmed (assignment).'}
        payday_day: {type: integer, minimum: 0, maximum: 31, description: 'Setting forecast.payday_day; 0 is off.'}
        handling_inferred: {type: boolean, description: 'True while field or remote is inferred, not supplied by the customer.'}
        case_data_sources:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/DataSource'}
        weather: {$ref: '#/components/schemas/WeatherCoverage'}
        weather_feed: {type: string, enum: [none, file, openmeteo, synthetic], description: 'OPENDISPATCH_WEATHER_SOURCE: where weather comes from when none is stored. synthetic is made-up weather for demonstrations.'}
        traffic_source: {type: string, enum: [none, file, synthetic], description: 'OPENDISPATCH_TRAFFIC_SOURCE: the daily traffic congestion the forecaster gets. synthetic is a made-up series; file reads the config/mappings/traffic/traffic_v1.json format.'}
    WeatherCoverage:
      description: What weather the forecaster gets. Stored rows are public weather.
      type: object
      additionalProperties: false
      required: [source, days, cities, from, to, fetched_at, attribution, data_sources]
      properties:
        source: {type: string, enum: [stored, feed, none], description: 'stored: weather_days has rows; feed: only OPENDISPATCH_WEATHER_SOURCE; none: no weather.'}
        days: {type: integer, minimum: 0}
        cities: {type: integer, minimum: 0}
        from: {$ref: '#/components/schemas/NullableDate'}
        to: {$ref: '#/components/schemas/NullableDate'}
        fetched_at: {$ref: '#/components/schemas/NullableTimestamp'}
        attribution: {type: [string, 'null'], maxLength: 120, description: 'Provider, models and licence, shown where the data appears.'}
        data_sources:
          type: array
          maxItems: 4
          items: {type: string, enum: [SYNTHETIC, IMPORTED, LIVE, PUBLIC_OPEN_DATA]}
    ForecastBacktestRun:
      description: The backtest run on this API server. idle when none ran since it started.
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [idle, running, succeeded, failed]}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
        error_class: {type: [string, 'null'], maxLength: 64, description: 'Why it failed, a class name (timeout, unreachable, no_history, ...), never a body.'}
    ForecastBacktestMetrics:
      description: One arm's error over the held-out days. WAPE at zone x hour, MAPE at zone x day. Null when not computable.
      type: object
      additionalProperties: false
      required: [wape, mape, mae, rmse, range_coverage]
      properties:
        wape: {type: [number, 'null'], minimum: 0}
        mape: {type: [number, 'null'], minimum: 0}
        mae: {type: [number, 'null'], minimum: 0}
        rmse: {type: [number, 'null'], minimum: 0}
        range_coverage: {type: [number, 'null'], minimum: 0, maximum: 1, description: Share of zone x hour cells whose actual fell inside the likely range. Null for a baseline.}
    ForecastBacktestDayType:
      type: object
      additionalProperties: false
      required: [days, wape, baseline_wape]
      properties:
        days: {type: integer, minimum: 0}
        wape: {type: [number, 'null'], minimum: 0}
        baseline_wape: {type: [number, 'null'], minimum: 0}
    ForecastBacktestZone:
      type: object
      additionalProperties: false
      required: [zone_id, wape, baseline_wape, actual_total, hours]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        wape: {type: [number, 'null'], minimum: 0}
        baseline_wape: {type: [number, 'null'], minimum: 0}
        actual_total: {type: number, minimum: 0}
        hours:
          description: The zone's error per hour of day, 0 to 23, for the hours that had cases.
          type: array
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [hour, wape, baseline_wape]
            properties:
              hour: {type: integer, minimum: 0, maximum: 23}
              wape: {type: [number, 'null'], minimum: 0}
              baseline_wape: {type: [number, 'null'], minimum: 0}
    ForecastBacktestChallenger:
      description: 'The challenger scored on the same held-out days and origins. Lift = (champion error - challenger error) / champion error; above 0 means the challenger did better.'
      type: object
      additionalProperties: false
      required: [champion, challenger, challenger_ran, gate_result, champion_wape, challenger_wape, wape_lift, champion_mape, challenger_mape, mape_lift, error]
      properties:
        champion: {type: string, maxLength: 64}
        challenger: {type: string, maxLength: 64}
        challenger_ran: {type: [string, 'null'], maxLength: 64, description: What the engine said it ran.}
        gate_result: {type: [string, 'null'], enum: [pass, fail, not_enough_history, null]}
        champion_wape: {type: [number, 'null']}
        challenger_wape: {type: [number, 'null']}
        wape_lift: {type: [number, 'null']}
        champion_mape: {type: [number, 'null']}
        challenger_mape: {type: [number, 'null']}
        mape_lift: {type: [number, 'null']}
        error: {type: [string, 'null'], maxLength: 300, description: Why the challenger could not be scored.}
    ForecastBacktest:
      description: 'The newest kept forecast backtest, for the Backtest card. The full report stays on the server.'
      type: object
      additionalProperties: false
      required: [generated_at, data_source, mixed_sources, illustrative, model_version, held_out, training, gate, engine, naive, segment, event_days, ordinary_days, weakest_zones, challenger]
      properties:
        generated_at: {$ref: '#/components/schemas/Timestamp'}
        data_source: {$ref: '#/components/schemas/DataSource'}
        mixed_sources: {type: boolean, description: 'True when the cases came from more than one source; data_source is then SYNTHETIC if any were synthetic.'}
        illustrative: {type: boolean}
        model_version: {type: string, maxLength: 64}
        held_out:
          type: object
          additionalProperties: false
          required: [from, to, days]
          properties:
            from: {$ref: '#/components/schemas/NullableDate'}
            to: {$ref: '#/components/schemas/NullableDate'}
            days: {type: integer, minimum: 0}
        training:
          description: The model's own training window and feature count, when the engine reported them.
          type: object
          additionalProperties: false
          required: [from, to, features]
          properties:
            from: {$ref: '#/components/schemas/NullableDate'}
            to: {$ref: '#/components/schemas/NullableDate'}
            features: {type: [integer, 'null'], minimum: 0}
        gate:
          type: object
          additionalProperties: false
          required: [result, baseline, min_improvement, improvement, worse_zones, compared_zones]
          properties:
            result: {type: string, enum: [pass, fail, not_enough_history]}
            baseline: {type: string, enum: [naive, segment], description: The baseline the gate compared with.}
            min_improvement: {type: number, minimum: 0}
            improvement: {type: [number, 'null'], description: 'WAPE improvement over the gate''s baseline, as a share.'}
            worse_zones: {type: integer, minimum: 0}
            compared_zones: {type: integer, minimum: 0}
        engine: {$ref: '#/components/schemas/ForecastBacktestMetrics'}
        naive: {$ref: '#/components/schemas/ForecastBacktestMetrics'}
        segment: {oneOf: [{$ref: '#/components/schemas/ForecastBacktestMetrics'}, {type: 'null'}], description: The customer's segment method; null when it could not be computed.}
        event_days: {$ref: '#/components/schemas/ForecastBacktestDayType'}
        ordinary_days: {$ref: '#/components/schemas/ForecastBacktestDayType'}
        weakest_zones: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ForecastBacktestZone'}}
        challenger: {oneOf: [{$ref: '#/components/schemas/ForecastBacktestChallenger'}, {type: 'null'}]}
    ForecastBacktestState:
      type: object
      additionalProperties: false
      required: [latest, run, active_model]
      properties:
        latest: {oneOf: [{$ref: '#/components/schemas/ForecastBacktest'}, {type: 'null'}]}
        run: {$ref: '#/components/schemas/ForecastBacktestRun'}
        active_model: {type: string, maxLength: 64, description: The champion model now; a latest backtest of another model is stale.}
    ForecastModelName:
      description: A registered forecaster model.
      type: string
      enum: [ensemble-6, ensemble-5, ensemble-4, ensemble-3, ensemble-2, seasonal-profile-1, lightgbm-1, ets-1, sarima-1, prophet-1, mlp-1]
    GateBaseline:
      description: 'What the backtest gate compares with: segment (The customer''s segment-average method, the default) or naive (same hour last week).'
      type: string
      enum: [segment, naive]
    ForecastModelSettings:
      type: object
      additionalProperties: false
      required: [champion_model, challenger_model, gate_baseline, models]
      properties:
        champion_model: {type: string, maxLength: 64, description: The model the plans use.}
        challenger_model: {type: [string, 'null'], maxLength: 64, description: 'Run beside the champion and scored in the backtest; null when none.'}
        gate_baseline: {$ref: '#/components/schemas/GateBaseline'}
        models: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ForecastModelName'}}
        horizon_days: {type: integer, minimum: 7, maximum: 30, description: 'Setting forecast.horizon_days: the days each forecast run covers.'}
        auto_retrain: {type: boolean, description: 'Setting forecast.auto_retrain: when rolling accuracy degrades past the limit, the worker also retrains (default true).'}
    ForecastModelSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        challenger_model: {oneOf: [{$ref: '#/components/schemas/ForecastModelName'}, {type: 'null'}]}
        gate_baseline: {$ref: '#/components/schemas/GateBaseline'}
        horizon_days: {type: integer, minimum: 7, maximum: 30}
        auto_retrain: {type: boolean}
    ExperimentParams:
      description: What a tracked run was asked. Absent fields did not apply.
      type: object
      additionalProperties: false
      properties:
        horizon_days: {type: integer, minimum: 1, maximum: 30}
        held_out_days: {type: integer, minimum: 0}
        history_days: {type: integer, minimum: 0}
        gate_baseline: {$ref: '#/components/schemas/GateBaseline'}
        degraded_zones: {type: integer, minimum: 0}
        degradation_limit: {type: number, minimum: 0}
    ExperimentMetrics:
      description: What a tracked run measured. Absent fields were not measured. Error shares, not percentages.
      type: object
      additionalProperties: false
      properties:
        wape: {type: number, minimum: 0}
        mape: {type: number, minimum: 0}
        baseline_wape: {type: number, minimum: 0}
        improvement: {type: number}
        gate_result: {type: string, maxLength: 40}
        challenger_wape: {type: number, minimum: 0}
        wape_lift: {type: number}
        worst_zone_wape: {type: number, minimum: 0}
    ForecastExperiment:
      description: 'One tracked model run. kind backtest scores the champion (and the challenger) on held-out days; challenger is a challenger forecast run; retrain refits the champion on the latest history. dataset_snapshot_id names the history it ran on: the same case counts give the same id.'
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [kind, trigger, status, model_version, challenger_model, dataset_snapshot_id, forecast_run_id, params, metrics, illustrative, started_at, finished_at, error_class]
          properties:
            kind: {type: string, enum: [backtest, challenger, retrain]}
            trigger: {type: string, enum: [manual, schedule, degradation]}
            status: {type: string, enum: [running, succeeded, failed]}
            model_version: {type: string, maxLength: 64}
            challenger_model: {type: [string, 'null'], maxLength: 64}
            dataset_snapshot_id: {type: [string, 'null'], maxLength: 64}
            forecast_run_id: {$ref: '#/components/schemas/NullableUuid'}
            params: {$ref: '#/components/schemas/ExperimentParams'}
            metrics: {$ref: '#/components/schemas/ExperimentMetrics'}
            illustrative: {type: boolean}
            started_at: {$ref: '#/components/schemas/NullableTimestamp'}
            finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
            error_class: {type: [string, 'null'], maxLength: 40}
      unevaluatedProperties: false
    ForecastExperimentList: {type: object, additionalProperties: false, required: [items, page], properties: {items: {type: array, items: {$ref: '#/components/schemas/ForecastExperiment'}}, page: {$ref: '#/components/schemas/PageInfo'}}}
    ForecastAccuracyFigures:
      description: 'Forecast against actual for one zone or all of them, over one day. WAPE at zone x hour. Null when there were no cases.'
      type: object
      additionalProperties: false
      required: [forecast, actual, difference, wape, within_range]
      properties:
        forecast: {type: number, minimum: 0}
        actual: {type: integer, minimum: 0}
        difference: {type: [number, 'null'], description: '(forecast - actual) / actual.'}
        wape: {type: [number, 'null'], minimum: 0}
        within_range: {type: number, minimum: 0, maximum: 1, description: Share of the 96 intervals whose actual fell inside the likely range.}
    ForecastAccuracy:
      description: 'A past day: the forecast made for it against the cases that came (Forecast Explorer).'
      type: object
      additionalProperties: false
      required: [dates, date, zone_id, run, data_source, mixed_sources, illustrative, overall, zones, intervals]
      properties:
        dates: {type: array, maxItems: 28, items: {$ref: '#/components/schemas/LocalDate'}, description: 'Recent past days with a stored forecast, newest first.'}
        date: {$ref: '#/components/schemas/NullableDate'}
        zone_id: {$ref: '#/components/schemas/NullableUuid'}
        run:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, model_version, created_at]
              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                model_version: {type: string, maxLength: 64}
                created_at: {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        data_source: {$ref: '#/components/schemas/DataSource'}
        mixed_sources: {type: boolean}
        illustrative: {type: boolean}
        overall: {oneOf: [{$ref: '#/components/schemas/ForecastAccuracyFigures'}, {type: 'null'}], description: The zone of zone_id.}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, figures]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              figures: {$ref: '#/components/schemas/ForecastAccuracyFigures'}
        intervals:
          description: The 96 intervals of zone_id; empty without a date.
          type: array
          maxItems: 96
          items:
            type: object
            additionalProperties: false
            required: [interval_index, low, expected, high, actual]
            properties:
              interval_index: {type: integer, minimum: 0, maximum: 95}
              low: {type: number, minimum: 0}
              expected: {type: number, minimum: 0}
              high: {type: number, minimum: 0}
              actual: {type: integer, minimum: 0}
    RollingAccuracyFigures:
      description: 'Forecast against actual over the rolling window. MAPE: mean of |forecast - actual| / actual over the units with cases (a zone day; for an hour of day, a zone day hour). WAPE: sum of |forecast - actual| over the sum of actual. Null when there were no cases.'
      type: object
      additionalProperties: false
      required: [days, forecast, actual, mape, wape, target_status]
      properties:
        days: {type: integer, minimum: 0, description: Days of the window with a stored forecast.}
        forecast: {type: number, minimum: 0}
        actual: {type: integer, minimum: 0}
        mape: {type: [number, 'null'], minimum: 0}
        wape: {type: [number, 'null'], minimum: 0}
        target_status: {type: [string, 'null'], enum: [at_or_below, above, null], description: MAPE against mape_target; null without a MAPE.}
    RollingForecastAccuracy:
      description: 'The rolling forecast accuracy (Admin Forecast and Model).'
      type: object
      additionalProperties: false
      required: [window_days, window_start, window_end, computed_at, mape_target, data_source, data_sources, mixed_sources, illustrative, overall, zones, hours, weekdays]
      properties:
        window_days: {type: integer, minimum: 1, maximum: 366}
        window_start: {$ref: '#/components/schemas/NullableDate'}
        window_end: {$ref: '#/components/schemas/NullableDate'}
        computed_at: {$ref: '#/components/schemas/NullableTimestamp'}
        mape_target: {type: number, exclusiveMinimum: 0, maximum: 1}
        data_source: {$ref: '#/components/schemas/DataSource'}
        data_sources: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/DataSource'}, description: 'Every source of the cases measured; empty before the first stored window.'}
        mixed_sources: {type: boolean}
        illustrative: {type: boolean}
        overall: {oneOf: [{$ref: '#/components/schemas/RollingAccuracyFigures'}, {type: 'null'}]}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, figures]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              figures: {$ref: '#/components/schemas/RollingAccuracyFigures'}
        hours:
          type: array
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [hour, figures]
            properties:
              hour: {type: integer, minimum: 0, maximum: 23, description: Riyadh time.}
              figures: {$ref: '#/components/schemas/RollingAccuracyFigures'}
        weekdays:
          type: array
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [weekday, figures]
            properties:
              weekday: {type: integer, minimum: 0, maximum: 6, description: 0 is Sunday.}
              figures: {$ref: '#/components/schemas/RollingAccuracyFigures'}
    ModelActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 300}
