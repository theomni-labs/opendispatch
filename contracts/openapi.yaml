openapi: 3.1.0
info:
  title: OpenDispatch API
  version: 1.0.0
  summary: Accident Demand Planning and Agent Scheduling System, API contract
  description: |
    Single source of truth for OpenDispatch types. Generated TypeScript lives in
    `apps/web/src/lib/types/` and is never hand-edited.

    **Conventions (deliberate, see contracts/README.md)**

    - Context comes from the server. No operation takes a tenant, customer, role or request context
      from the caller. The tenant comes from the verified token (oidc mode) or the demo session
      cookie (demo mode). Bodies name the role of a user being managed `assigned_role`, never `role`.
    - Every persisted record carries `id`, `tenant_id`, `created_at`, `updated_at`, `created_by` and
      `data_source` (SYNTHETIC, IMPORTED, LIVE). Response schemas reject unknown properties
      (`unevaluatedProperties: false`); customer-specific data goes in `extra`. Request schemas
      reject unknown properties too (`additionalProperties: false`).
    - Timestamps are ISO 8601 with an offset, Asia/Riyadh (+03:00) by convention. Dates are
      `YYYY-MM-DD`. Times of day are `HH:MM` local.
    - Lists are cursor paginated: `limit` (default 50, maximum 200) and `cursor`; the response has
      `items` and `page`.
    - Errors use the `ApiError` schema. Every operation lists a `4XX` response.
    - Extension fields on each operation: `x-module` (one of the 30 modules in `x-modules`, or a
      `platform.*` shared area), `x-required-access` (`view` or `edit`), `x-approval: true` on
      approve and reject operations, `x-install-modes` where an operation exists only in some
      install modes, `x-keycloak-side: true` where the state lives in Keycloak or the update agent
      and the api only passes it through, `x-demo-only: true` for operations not available in oidc mode.
    - Access model: `x-modules[].access` gives each role `none`, `view` or `edit` per module
      (the role matrix). An operation with `x-required-access: view` needs `view` or `edit`;
      `edit` needs `edit`. An operation with `x-approval: true` needs the role to be listed in the
      module's `approvers` instead of `edit`, and nobody may approve their own request
      (`SELF_APPROVAL_FORBIDDEN`). Zone scope is applied by the server to every list and write.
    - Engine payloads are the JSON Schema files in `contracts/engines/` and are referenced, not
      repeated.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Same origin as the web app. in demo mode the data layer answers these calls from fixtures.
