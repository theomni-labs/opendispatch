components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Keycloak access token (oidc mode). The api derives the tenant from the token's issuer and
        organisation, matched against known tenants. Never from request input.
    demoSession:
      type: apiKey
      in: cookie
      name: opendispatch_demo_session
      description: >-
        Demo mode only. Signed HttpOnly cookie written by the one sanctioned demo switcher server
        action. Not available in oidc mode.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identifier of the addressed record (UUID).
      schema: {$ref: '#/components/schemas/Uuid'}
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `page.next_cursor`.
      schema: {type: string, maxLength: 512}
    Search:
      name: q
      in: query
      description: Free-text search.
      schema: {type: string, maxLength: 200}
    ZoneId:
      name: zone_id
      in: query
      description: Restrict to one zone. The server also applies the caller's zone scope.
      schema: {$ref: '#/components/schemas/Uuid'}
    SubZoneId:
      name: sub_zone_id
      in: query
      schema: {$ref: '#/components/schemas/Uuid'}
    CityId:
      name: city_id
      in: query
      schema: {$ref: '#/components/schemas/Uuid'}
    Date:
      name: date
      in: query
      description: Calendar date, YYYY-MM-DD.
      schema: {type: string, format: date}
    DateFrom:
      name: date_from
      in: query
      description: First date, inclusive, YYYY-MM-DD.
      schema: {type: string, format: date}
    DateTo:
      name: date_to
      in: query
      description: Last date, inclusive, YYYY-MM-DD.
      schema: {type: string, format: date}
    From:
      name: from
      in: query
      description: Start of the time range, inclusive.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: End of the time range, exclusive.
      schema: {type: string, format: date-time}
    DataSourceFilter:
      name: data_source
      in: query
      schema: {$ref: '#/components/schemas/DataSource'}
  responses:
    ClientError:
      description: Client error. `code` says which (validation, sign-in, permission, not found, conflict, install mode).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NoContent:
      description: Done. No body.
  schemas:
    Uuid: {type: string, format: uuid}
    NullableUuid: {type: [string, 'null'], format: uuid}
    DataSource: {type: string, enum: [SYNTHETIC, IMPORTED, LIVE]}
    Timestamp: {type: string, format: date-time}
    NullableTimestamp: {type: [string, 'null'], format: date-time}
    LocalDate: {type: string, format: date}
    NullableDate: {type: [string, 'null'], format: date}
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local time of day, HH:MM, Asia/Riyadh. 00:00 as an end time means midnight.
    Latitude: {type: number, minimum: -90, maximum: 90}
    Longitude: {type: number, minimum: -180, maximum: 180}
    Extra:
      type: object
      additionalProperties: true
      description: Customer-specific data. Customers differ by configuration, never by tables.
    Handling:
      type: string
      enum: [field, remote_inferred]
      description: Derived from assigned_at until the customer supplies an explicit field. Screens show it as inferred.
    ClockStart:
      type: string
      enum: [assignment, registration]
      description: When the 10-minute clock starts (setting, default assignment).
    PlanningLevel:
      type: string
      enum: [zone, sub_zone, city]
      description: Level at which plans are made (setting, default zone).
    LiveStage:
      type: string
      enum: [shadow, recommend, automatic]
      description: Live-assignment stage of a zone.
    AssignmentSource:
      type: string
      enum: [OPENDISPATCH, CUSTOMER_FALLBACK, MANUAL]
    OverrideReasonCode:
      type: string
      enum: [agent_unavailable, vehicle_unavailable, closer_agent_known, skills_needed, dispatcher_judgement, other]
      description: The reason for a manual change. `other` requires a note.
    RoleId:
      type: string
      enum: [administrator, dispatch_supervisor, dispatcher, planner, remote_team_lead, viewer_auditor, change_approver]
    InstallMode:
      type: string
      enum: [private, dedicated, shared]
    Locale:
      type: string
      enum: [ar, en]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NO_ROLE_ASSIGNED
        - NOT_FOUND
        - CONFLICT
        - SELF_APPROVAL_FORBIDDEN
        - REASON_REQUIRED
        - INSTALL_MODE_UNAVAILABLE
        - MAINTENANCE
        - RATE_LIMITED
        - ENGINE_UNAVAILABLE
        - ALREADY_ASSIGNED
        - STORAGE_UNAVAILABLE
        - FEED_OUTAGE_SIMULATION_OFF
        - ASSISTANT_OFF
        - ASSISTANT_UNAVAILABLE
        - ASSISTANT_INVALID_OUTPUT
        - INTERNAL
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, maxLength: 500}
        request_id: {type: string, maxLength: 64, description: Reference code the user can quote to support.}
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string, maxLength: 200}
              message: {type: string, maxLength: 500}
    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor: {type: [string, 'null'], maxLength: 512}
        has_more: {type: boolean}
        total: {type: integer, minimum: 0, description: Present only when cheap to compute.}
    BaseRecord:
      type: object
      description: Fields every persisted record carries. The primary key is (tenant_id, id).
      required: [id, tenant_id, created_at, updated_at, created_by, data_source]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        created_by:
          $ref: '#/components/schemas/NullableUuid'
        data_source: {$ref: '#/components/schemas/DataSource'}
    # ---- Location ----
    City:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [external_id, case_code, name_en, name_ar, is_active]
          properties:
            external_id: {type: [string, 'null'], maxLength: 64, description: The customer's CityID. Join on IDs only; names have inconsistent capitals.}
            case_code:
              type: string
              pattern: '^[A-Z]{2}$'
              description: Two-letter prefix of case_number (RD = Riyadh). Codes other than RD are invented until the customer supplies them.
            name_en: {type: string, minLength: 1, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120, description: 'Null until the customer supplies Arabic names; screens fall back to English.'}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    Zone:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [external_id, city_id, name_en, name_ar, is_active]
          properties:
            external_id: {type: [string, 'null'], maxLength: 64, description: The customer's ZoneID.}
            city_id: {$ref: '#/components/schemas/Uuid'}
            name_en: {type: string, minLength: 1, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
      description: Assumed to be a customer dispatch center (a configurable assumption).
    SubZone:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [external_id, zone_id, name_en, name_ar, latitude, longitude, is_active]
          properties:
            external_id: {type: [string, 'null'], maxLength: 64, description: The customer's SubZoneID.}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            name_en: {type: string, minLength: 1, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
      description: Forecast area. Centres in fixtures are invented, never derived from real cases.
    StandbyPoint:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [zone_id, name_en, name_ar, latitude, longitude, coverage_radius_m, is_active]
          properties:
            zone_id: {$ref: '#/components/schemas/Uuid'}
            sub_zone_id: {$ref: '#/components/schemas/NullableUuid'}
            name_en: {type: string, minLength: 1, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            coverage_radius_m: {type: integer, minimum: 100, maximum: 50000}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    CityWrite:
      type: object
      additionalProperties: false
      required: [case_code, name_en]
      properties:
        external_id: {type: [string, 'null'], maxLength: 64}
        case_code: {type: string, pattern: '^[A-Z]{2}$'}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        is_active: {type: boolean, default: true}
        extra: {$ref: '#/components/schemas/Extra'}
    ZoneWrite:
      type: object
      additionalProperties: false
      required: [city_id, name_en]
      properties:
        external_id: {type: [string, 'null'], maxLength: 64}
        city_id: {$ref: '#/components/schemas/Uuid'}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        latitude: {$ref: '#/components/schemas/Latitude'}
        longitude: {$ref: '#/components/schemas/Longitude'}
        is_active: {type: boolean, default: true}
        extra: {$ref: '#/components/schemas/Extra'}
    SubZoneWrite:
      type: object
      additionalProperties: false
      required: [zone_id, name_en, latitude, longitude]
      properties:
        external_id: {type: [string, 'null'], maxLength: 64}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        latitude: {$ref: '#/components/schemas/Latitude'}
        longitude: {$ref: '#/components/schemas/Longitude'}
        is_active: {type: boolean, default: true}
        extra: {$ref: '#/components/schemas/Extra'}
    StandbyPointWrite:
      type: object
      additionalProperties: false
      required: [zone_id, name_en, latitude, longitude, coverage_radius_m]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        sub_zone_id: {$ref: '#/components/schemas/NullableUuid'}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        latitude: {$ref: '#/components/schemas/Latitude'}
        longitude: {$ref: '#/components/schemas/Longitude'}
        coverage_radius_m: {type: integer, minimum: 100, maximum: 50000}
        is_active: {type: boolean, default: true}
        extra: {$ref: '#/components/schemas/Extra'}
    # ---- Cases ----
    CaseType:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [external_id, name_en, name_ar, is_active]
          properties:
            external_id: {type: [string, 'null'], maxLength: 64, description: The customer's CaseTypeID.}
            name_en:
              type: string
              maxLength: 120
              description: 'the data model spelling: Standard case, Police attended, Unlisted.'
            name_ar: {type: [string, 'null'], maxLength: 120}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    Case:
      description: >-
        A reported accident case. Field names are the internal names of the data model. Fields the customer's
        file lacks (agent_id to channel) are synthetic and labelled until supplied; the record's
        `synthetic_fields` names them when the record itself is IMPORTED or LIVE.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [external_id, case_number, registered_at, city_id, zone_id, sub_zone_id, latitude, longitude, case_type_id, parties_involved, assigned_at, arrived_at, closed_at, handling]
          properties:
            external_id: {type: string, minLength: 1, maxLength: 64, description: 'The source system''s record id. Unique per tenant; our id is a UUID so IDs from different customers never collide.'}
            case_number: {type: string, pattern: '^[A-Z]{2}[A-Za-z0-9-]+$', maxLength: 64, description: First two letters are a city code. Format beyond that is invented in fixtures.}
            registered_at: {$ref: '#/components/schemas/Timestamp'}
            city_id: {$ref: '#/components/schemas/Uuid'}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            sub_zone_id: {$ref: '#/components/schemas/Uuid'}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            case_type_id: {$ref: '#/components/schemas/Uuid'}
            parties_involved: {type: integer, minimum: 0, description: 'Values 0 and 1 occur (under 1%) and are valid. Meaning to be confirmed by the customer.'}
            assigned_at:
              $ref: '#/components/schemas/NullableTimestamp'
              description: 'Empty for about 43% of cases (remote). May be earlier than registered_at (some Unlisted cases); that is a data-quality finding, not a validation error.'
            arrived_at: {$ref: '#/components/schemas/NullableTimestamp'}
            closed_at: {$ref: '#/components/schemas/NullableTimestamp', description: 'For remote cases, the end of the review.'}
            handling: {$ref: '#/components/schemas/Handling'}
            agent_id: {$ref: '#/components/schemas/NullableUuid'}
            vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
            severity: {type: [string, 'null'], enum: [minor, moderate, severe, null], description: Synthetic vocabulary until the customer supplies severity.}
            injury_present: {type: [boolean, 'null']}
            estimated_damage_sar: {type: [number, 'null'], minimum: 0}
            on_scene_completed_at: {$ref: '#/components/schemas/NullableTimestamp'}
            remote_review_at: {$ref: '#/components/schemas/NullableTimestamp'}
            channel: {type: [string, 'null'], enum: [app, phone, whatsapp, null]}
            synthetic_fields:
              type: array
              uniqueItems: true
              items: {type: string, enum: [agent_id, vehicle_id, severity, injury_present, estimated_damage_sar, on_scene_completed_at, remote_review_at, channel]}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    # ---- People and fleet ----
    Agent:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [code, name_en, name_ar, kind, home_zone_id, is_active]
          properties:
            code: {type: string, minLength: 1, maxLength: 32, description: Staff code. Synthetic until the customer supplies agent IDs.}
            name_en: {type: string, maxLength: 120, description: 'Invented in fixtures, never a real person.'}
            name_ar: {type: [string, 'null'], maxLength: 120}
            kind: {type: string, enum: [field, remote]}
            home_zone_id: {$ref: '#/components/schemas/NullableUuid', description: 'Null for remote agents, who belong to the remote pool.'}
            default_vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
            is_active: {type: boolean}
            eligible_shift_pattern_ids: {type: [array, 'null'], uniqueItems: true, maxItems: 50, items: {$ref: '#/components/schemas/Uuid'}, description: 'Additive. The shift patterns this agent may work, all of their kind; null when any pattern of their kind. Sent to the optimizer as eligible_shift_pattern_ids.'}
            annual_leave_days: {type: [integer, 'null'], minimum: 0, maximum: 365, description: 'Additive. Annual leave entitlement in days a year; null when not recorded.'}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    AgentWrite:
      type: object
      additionalProperties: false
      required: [code, name_en, kind]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        kind: {type: string, enum: [field, remote]}
        home_zone_id: {$ref: '#/components/schemas/NullableUuid'}
        default_vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
        is_active: {type: boolean, default: true}
        eligible_shift_pattern_ids: {type: [array, 'null'], minItems: 1, uniqueItems: true, maxItems: 50, items: {$ref: '#/components/schemas/Uuid'}, description: 'Additive. Null for any pattern of the kind. Omitted on a change: kept as it was.'}
        annual_leave_days: {type: [integer, 'null'], minimum: 0, maximum: 365, description: 'Additive. Omitted on a change: kept as it was.'}
        extra: {$ref: '#/components/schemas/Extra'}
    Vehicle:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [code, zone_id, is_active]
          properties:
            code: {type: string, minLength: 1, maxLength: 32}
            plate_number: {type: [string, 'null'], maxLength: 16, description: Invented in fixtures.}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            is_active: {type: boolean}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    VehicleWrite:
      type: object
      additionalProperties: false
      required: [code, zone_id]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        plate_number: {type: [string, 'null'], maxLength: 16}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        is_active: {type: boolean, default: true}
        extra: {$ref: '#/components/schemas/Extra'}
    VehicleMaintenance:
      description: 'A window in which a vehicle is in maintenance (spec 4.4): not available to the optimizer, not counted with a vehicle in the gap view.'
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [vehicle_id, starts_at, ends_at, reason]
          properties:
            vehicle_id: {$ref: '#/components/schemas/Uuid'}
            starts_at: {$ref: '#/components/schemas/Timestamp'}
            ends_at: {$ref: '#/components/schemas/Timestamp'}
            reason: {type: string, minLength: 1, maxLength: 200}
      unevaluatedProperties: false
    VehicleMaintenanceWrite:
      type: object
      additionalProperties: false
      required: [vehicle_id, starts_at, ends_at, reason]
      properties:
        vehicle_id: {$ref: '#/components/schemas/Uuid'}
        starts_at: {$ref: '#/components/schemas/Timestamp'}
        ends_at: {$ref: '#/components/schemas/Timestamp', description: 'After starts_at, at most 366 days later.'}
        reason: {type: string, minLength: 1, maxLength: 200}
    AgentSkill:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [agent_id, skill_code]
          properties:
            agent_id: {$ref: '#/components/schemas/Uuid'}
            skill_code: {type: string, minLength: 1, maxLength: 64, description: 'Vocabulary is invented (plan has none): general, heavy_vehicle, pedestrian, highway, bilingual_arabic_english.'}
      unevaluatedProperties: false
    AgentSkillsWrite:
      type: object
      additionalProperties: false
      required: [skill_codes]
      properties:
        skill_codes: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}}
    # ---- Live position ----
    AgentStatus:
      description: Current status and position of one agent. One row per agent.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [agent_id, status, latitude, longitude, position_at]
          properties:
            agent_id: {$ref: '#/components/schemas/Uuid'}
            status: {$ref: '#/components/schemas/AgentLiveStatus'}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            position_at: {$ref: '#/components/schemas/Timestamp'}
            zone_id: {$ref: '#/components/schemas/NullableUuid'}
            vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
            current_case_id: {$ref: '#/components/schemas/NullableUuid'}
      unevaluatedProperties: false
    AgentLiveStatus:
      type: string
      enum: [available, assigned, en_route, on_scene, on_break, offline]
    AgentPosition:
      description: Recent position history, kept for a limited period. Synthetic positions are generated on the fly in the demo, not stored.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [agent_id, recorded_at, latitude, longitude]
          properties:
            agent_id: {$ref: '#/components/schemas/Uuid'}
            recorded_at: {$ref: '#/components/schemas/Timestamp'}
            latitude: {$ref: '#/components/schemas/Latitude'}
            longitude: {$ref: '#/components/schemas/Longitude'}
            speed_kmh: {type: [number, 'null'], minimum: 0}
      unevaluatedProperties: false
    # ---- Assignment ----
    TenMinuteReading:
      description: One case measured against the 10-minute target in both readings. Both are always present; which is primary comes from a setting.
      type: object
      additionalProperties: false
      required: [threshold_seconds, from_registration_seconds, from_assignment_seconds, within_from_registration, within_from_assignment]
      properties:
        threshold_seconds: {type: integer, minimum: 1, default: 600}
        from_registration_seconds: {type: [integer, 'null']}
        from_assignment_seconds: {type: [integer, 'null']}
        within_from_registration: {type: [boolean, 'null']}
        within_from_assignment: {type: [boolean, 'null']}
    Assignment:
      description: An agent assigned (or, in shadow mode, decided but not sent) for one case. One sent assignment per case; a later one is refused with ALREADY_ASSIGNED.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [case_id, agent_id, decided_at, source, stage, state, reason_code, estimated_arrival_at, estimated_travel_seconds]
          properties:
            case_id: {$ref: '#/components/schemas/Uuid'}
            agent_id: {$ref: '#/components/schemas/Uuid'}
            decided_at: {$ref: '#/components/schemas/Timestamp'}
            source: {$ref: '#/components/schemas/AssignmentSource'}
            stage: {$ref: '#/components/schemas/LiveStage', description: Stage of the zone when the decision was made.}
            state:
              type: string
              enum: [shadow, recommended, assigned, overridden, superseded, cancelled]
            reason_code:
              type: [string, 'null']
              enum: [agent_unavailable, vehicle_unavailable, closer_agent_known, skills_needed, dispatcher_judgement, other, null]
              description: Required (not null) when source is MANUAL.
            reason_note: {type: [string, 'null'], maxLength: 500, description: Required when reason_code is other.}
            estimated_arrival_at: {$ref: '#/components/schemas/NullableTimestamp'}
            estimated_travel_seconds: {type: [integer, 'null'], minimum: 0}
            decided_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            model_version: {type: [string, 'null'], maxLength: 64}
            extra: {$ref: '#/components/schemas/Extra'}
        - if:
            type: object
            required: [source]
            properties: {source: {const: MANUAL}}
          then:
            type: object
            required: [reason_code]
            properties: {reason_code: {type: string}}
      unevaluatedProperties: false
    AssignmentEvent:
      description: Append-only history of one assignment (recommended, accepted, overridden, sent, fallback triggered).
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [case_id, event_type, occurred_at, source]
          properties:
            assignment_id: {$ref: '#/components/schemas/NullableUuid'}
            case_id: {$ref: '#/components/schemas/Uuid'}
            event_type:
              type: string
              enum: [recommended, accepted, overridden, sent, acknowledged, rejected, fallback_triggered, superseded, cancelled]
            occurred_at: {$ref: '#/components/schemas/Timestamp'}
            source: {$ref: '#/components/schemas/AssignmentSource'}
            actor_user_id: {$ref: '#/components/schemas/NullableUuid'}
            reason_code: {$ref: '#/components/schemas/OverrideReasonCode'}
            note: {type: [string, 'null'], maxLength: 500}
            detail: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    ComparisonSide:
      type: object
      additionalProperties: false
      required: [agent_id, assigned_at, estimated_travel_seconds, reading]
      properties:
        agent_id: {$ref: '#/components/schemas/NullableUuid'}
        assigned_at: {$ref: '#/components/schemas/NullableTimestamp'}
        estimated_travel_seconds: {type: [integer, 'null'], minimum: 0}
        actual_travel_seconds: {type: [integer, 'null'], minimum: 0}
        reading: {$ref: '#/components/schemas/TenMinuteReading'}
    AssignmentComparison:
      description: Shadow mode. What OpenDispatch would have done beside what the customer's dispatch did, with both 10-minute readings for each side.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [case_id, compared_at, same_agent, opendispatch, customer]
          properties:
            case_id: {$ref: '#/components/schemas/Uuid'}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            compared_at: {$ref: '#/components/schemas/Timestamp'}
            same_agent: {type: boolean}
            opendispatch: {$ref: '#/components/schemas/ComparisonSide'}
            customer: {$ref: '#/components/schemas/ComparisonSide'}
      unevaluatedProperties: false
    # ---- Time ----
    ShiftHours:
      type: object
      additionalProperties: false
      required: [applies]
      properties:
        applies: {type: boolean, description: False when the pattern does not run in this calendar mode (Evening has no normal hours).}
        start_time: {$ref: '#/components/schemas/LocalTime'}
        end_time: {$ref: '#/components/schemas/LocalTime'}
        crosses_midnight: {type: boolean, readOnly: true}
    ShiftPattern:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [code, name_en, name_ar, kind, normal, ramadan, break_rule_id, status]
          properties:
            code: {type: string, minLength: 1, maxLength: 32}
            name_en: {type: string, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            kind: {type: string, enum: [field, remote]}
            normal: {$ref: '#/components/schemas/ShiftHours'}
            ramadan: {$ref: '#/components/schemas/ShiftHours'}
            break_rule_id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [draft, active], description: All shift times are our assumptions and start as draft.}
            extra: {$ref: '#/components/schemas/Extra'}
      unevaluatedProperties: false
    ShiftPatternWrite:
      type: object
      additionalProperties: false
      required: [code, name_en, kind, normal, ramadan, break_rule_id]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        kind: {type: string, enum: [field, remote]}
        normal: {$ref: '#/components/schemas/ShiftHours'}
        ramadan: {$ref: '#/components/schemas/ShiftHours'}
        break_rule_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [draft, active], default: draft}
    BreakRule:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [code, name_en, break_minutes, after_consecutive_hours]
          properties:
            code: {type: string, minLength: 1, maxLength: 32}
            name_en: {type: string, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            break_minutes: {type: integer, minimum: 1, maximum: 180}
            after_consecutive_hours: {type: number, exclusiveMinimum: 0, maximum: 12}
      unevaluatedProperties: false
    BreakRuleWrite:
      type: object
      additionalProperties: false
      required: [code, name_en, break_minutes, after_consecutive_hours]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        break_minutes: {type: integer, minimum: 1, maximum: 180}
        after_consecutive_hours: {type: number, exclusiveMinimum: 0, maximum: 12}
    HijriDate:
      type: object
      additionalProperties: false
      required: [year, month, day]
      properties:
        year: {type: integer, minimum: 1300, maximum: 1600}
        month: {type: integer, minimum: 1, maximum: 12}
        day: {type: integer, minimum: 1, maximum: 30}
    LeaveRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [agent_id, start_date, end_date, leave_type, status, requested_at]
          properties:
            agent_id: {$ref: '#/components/schemas/Uuid'}
            start_date: {$ref: '#/components/schemas/LocalDate'}
            end_date: {$ref: '#/components/schemas/LocalDate'}
            leave_type: {type: string, enum: [annual, sick, emergency, other], description: Invented vocabulary.}
            status: {type: string, enum: [requested, approved, declined]}
            requested_at: {$ref: '#/components/schemas/Timestamp'}
            decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
            decided_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            decision_note: {type: [string, 'null'], maxLength: 500}
            note: {type: [string, 'null'], maxLength: 500}
      unevaluatedProperties: false
    LeaveRequestWrite:
      type: object
      additionalProperties: false
      required: [agent_id, start_date, end_date, leave_type]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid'}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        leave_type: {type: string, enum: [annual, sick, emergency, other]}
        note: {type: [string, 'null'], maxLength: 500}
    Holiday:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [name_en, name_ar, start_date, end_date, kind, hijri_start]
          properties:
            name_en: {type: string, maxLength: 120}
            name_ar: {type: [string, 'null'], maxLength: 120}
            start_date: {$ref: '#/components/schemas/LocalDate'}
            end_date: {$ref: '#/components/schemas/LocalDate'}
            kind: {type: string, enum: [public, religious, observance]}
            hijri_start: {$ref: '#/components/schemas/HijriDate'}
            hijri_end: {$ref: '#/components/schemas/HijriDate'}
      unevaluatedProperties: false
    HolidayWrite:
      type: object
      additionalProperties: false
      required: [name_en, start_date, end_date, kind]
      properties:
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        kind: {type: string, enum: [public, religious, observance]}
    CalendarEventScope:
      description: 'Where an event applies: no cities and no region is everywhere.'
      type: object
      additionalProperties: false
      required: [cities, region]
      properties:
        cities: {type: array, maxItems: 40, items: {type: string, maxLength: 80}}
        region: {type: [string, 'null'], enum: [central, western, null]}
    CalendarEvent:
      type: object
      additionalProperties: false
      required: [id, kind, event_type, name, start_date, end_date, source, scope, editable]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [school, season, umrah, derived, customer, notice], description: 'school, season, umrah and notice are set here; derived and customer are read only. notice is an event saved from a notice, scoped to zones.'}
        event_type: {type: [string, 'null'], maxLength: 40, description: 'The forecaster''s event type (eid, hajj, national_day, season_event, other, school_vacation), or null for a range set here.'}
        name: {type: string, maxLength: 120, description: 'English, or for a customer school vacation the period code (vacation_summer, ...).'}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        source: {type: string, enum: [setting, hijri, fixed, customer]}
        scope: {$ref: '#/components/schemas/CalendarEventScope'}
        editable: {type: boolean}
        name_ar: {type: [string, 'null'], maxLength: 120, description: 'Optional. Arabic name of a notice event.'}
        notice: {$ref: '#/components/schemas/CalendarNoticeDetails'}
    CalendarEventWrite:
      type: object
      additionalProperties: false
      required: [kind, name, start_date, end_date]
      properties:
        kind: {type: string, enum: [school, season, umrah, notice]}
        name: {type: string, minLength: 1, maxLength: 120}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        name_ar: {type: [string, 'null'], maxLength: 120, description: 'Only with kind notice.'}
        notice: {$ref: '#/components/schemas/CalendarNoticeWrite'}
    CalendarNoticeType:
      type: string
      enum: [sports_match, festival, concert, conference, road_closure, public_holiday, other]
    CalendarImpact:
      type: string
      enum: [low, medium, high]
    CalendarNoticeWrite:
      type: object
      additionalProperties: false
      required: [notice_type, zone_ids, impact]
      properties:
        notice_type: {$ref: '#/components/schemas/CalendarNoticeType'}
        zone_ids: {type: array, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: 'Empty: everywhere.'}
        start_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'On start_date; null is all day.'}
        end_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'On end_date; null is all day.'}
        impact: {$ref: '#/components/schemas/CalendarImpact'}
        impact_reason: {type: [string, 'null'], maxLength: 300}
        quote: {type: [string, 'null'], maxLength: 300, description: 'The words of the notice the impact rests on.'}
        assisted: {type: boolean, description: 'True when the event was drafted by the assistant; recorded in the audit detail.'}
    CalendarNoticeDetails:
      type: object
      additionalProperties: false
      required: [notice_type, forecast_event_type, zone_ids, start_time, end_time, impact, impact_reason, quote, assisted]
      properties:
        notice_type: {$ref: '#/components/schemas/CalendarNoticeType'}
        forecast_event_type: {type: string, enum: [season_event, other], description: 'What the forecaster gets.'}
        zone_ids: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Uuid'}, description: 'Empty: everywhere.'}
        start_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        end_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        impact: {$ref: '#/components/schemas/CalendarImpact'}
        impact_reason: {type: [string, 'null'], maxLength: 300}
        quote: {type: [string, 'null'], maxLength: 300}
        assisted: {type: boolean}
    CalendarEvents:
      type: object
      additionalProperties: false
      required: [date_from, date_to, payday_day, items]
      properties:
        date_from: {$ref: '#/components/schemas/LocalDate'}
        date_to: {$ref: '#/components/schemas/LocalDate'}
        payday_day: {type: integer, minimum: 0, maximum: 31, description: 'Setting forecast.payday_day; 0 is off. An assumption to confirm with the customer.'}
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/CalendarEvent'}}
    PaydayDayUpdate:
      type: object
      additionalProperties: false
      required: [payday_day]
      properties:
        payday_day: {type: integer, minimum: 0, maximum: 31}
    HijriMonth:
      description: One Hijri month with its Gregorian start and end (Umm al-Qura). Assumption (holidays are listed with Hijri dates only) is a small reference table so screens show Ramadan and Eid without computing it.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [hijri_year, hijri_month, name_en, name_ar, gregorian_start, gregorian_end, is_ramadan]
          properties:
            hijri_year: {type: integer, minimum: 1300, maximum: 1600}
            hijri_month: {type: integer, minimum: 1, maximum: 12}
            name_en: {type: string, maxLength: 60}
            name_ar: {type: string, maxLength: 60}
            gregorian_start: {$ref: '#/components/schemas/LocalDate'}
            gregorian_end: {$ref: '#/components/schemas/LocalDate'}
            is_ramadan: {type: boolean}
      unevaluatedProperties: false
    PrayerTime:
      description: Prayer times for one city and date. Committed for 6 to 12 Sep 2026; other dates are computed by the data layer with adhan (Umm al-Qura).
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [city_id, prayer_date, fajr, dhuhr, asr, maghrib, isha, calculation_method]
          properties:
            city_id: {$ref: '#/components/schemas/Uuid'}
            prayer_date: {$ref: '#/components/schemas/LocalDate'}
            fajr: {$ref: '#/components/schemas/LocalTime'}
            sunrise: {$ref: '#/components/schemas/LocalTime'}
            dhuhr: {$ref: '#/components/schemas/LocalTime'}
            asr: {$ref: '#/components/schemas/LocalTime'}
            maghrib: {$ref: '#/components/schemas/LocalTime'}
            isha: {$ref: '#/components/schemas/LocalTime'}
            calculation_method: {type: string, enum: [umm_al_qura]}
      unevaluatedProperties: false
    # ---- Rules ----
    RuleCode:
      type: string
      pattern: '^RULE-[0-9]{3}[A-Z]?$'
      description: Business identifier of a classification rule, for example RULE-003 or RULE-003A.
    RuleOutcome:
      type: string
      enum: [remote_eligible, field_mandatory, field_preferred]
      description: 'Precedence when several rules match: field_mandatory over field_preferred over remote_eligible. No match: field_preferred (assumption).'
    RulePredicate:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
          description: 'Case attribute the rule tests, for example parties_involved, case_type, injury_present, estimated_damage_sar. Attributes such as pedestrian_involved have no internal name in the data model yet, so any snake_case name is allowed. adds severity (minor, moderate, severe), claim_value_sar, damage_assessment_method (photo, video, in_person), location_type (dense_urban, urban, suburban, highway, rural) and customer_preference (none, remote, field), kept in the case''s extra until the customer supplies them.'
        operator: {type: string, enum: [eq, neq, lt, lte, gt, gte, in]}
        value:
          oneOf:
            - {type: string, maxLength: 120}
            - {type: number}
            - {type: boolean}
            - {type: array, items: {type: [string, number]}}
    RuleCondition:
      type: object
      additionalProperties: false
      required: [match, predicates]
      properties:
        match: {type: string, enum: [all, any]}
        predicates: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RulePredicate'}}
    AssistantProvider:
      type: string
      enum: [off, ollama, openai]
    AssistantExplainTarget:
      type: string
      enum: [forecast_explorer, gap_surplus]
    AssistantStatus:
      type: object
      additionalProperties: false
      required: [provider, model, configured, offline, features]
      properties:
        provider: {$ref: '#/components/schemas/AssistantProvider'}
        model: {type: string, maxLength: 120, description: 'Empty when off.'}
        configured: {type: boolean}
        offline: {type: boolean, description: 'True when nothing leaves the install (ollama).'}
        reason: {type: string, maxLength: 200, description: 'Why it is off. Never a secret.'}
        features:
          type: object
          additionalProperties: false
          required: [rule_draft, explain, ask]
          properties:
            rule_draft: {type: boolean}
            explain: {type: array, items: {$ref: '#/components/schemas/AssistantExplainTarget'}}
            ask: {type: boolean}
            case_suggestion: {type: boolean, description: 'Optional (feature 4). The role may ask for case suggestions (view on the Live Dispatch Board or the Remote Queue).'}
            classifier_review: {type: boolean, description: 'Optional (feature 4). The role may see the Classifier review (view on Classification Rules).'}
            event_notice: {type: boolean, description: 'Optional. Edit on admin.leave-policy-calendar.'}
            scenario_draft: {type: boolean, description: 'Optional. Edit on ops.scenario-lab.'}
            import_mapping: {type: boolean, description: 'Suggest a mapping (edit on Data Import and Quality).'}
            import_issues: {type: boolean, description: 'Explain import issues (view on Data Import and Quality).'}
            handover: {type: boolean, description: 'Shift handover: view on ops.live-dispatch-board.'}
            alerts_digest: {type: boolean, description: 'Alerts digest: any signed-in role with a role.'}
    AssistantMeta:
      type: object
      required: [provider, model, duration_ms, suggestion, illustrative, data_source]
      properties:
        provider: {type: string, maxLength: 40, description: 'Which provider produced this answer.'}
        model: {type: string, maxLength: 120}
        duration_ms: {type: integer, minimum: 0}
        suggestion: {type: boolean, description: 'Always true: an assistant answer is a suggestion.'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    AssistantRuleDraftRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantRuleDraft:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [draft]
          properties:
            draft:
              type: object
              additionalProperties: false
              required: [name_en, name_ar, condition, condition_text_en, outcome]
              properties:
                name_en: {type: string, maxLength: 120}
                name_ar: {type: [string, 'null'], maxLength: 120}
                condition: {$ref: '#/components/schemas/RuleCondition'}
                condition_text_en: {type: string, maxLength: 500}
                outcome: {$ref: '#/components/schemas/RuleOutcome'}
            unmapped:
              description: 'Optional. Phrases of the request the draft could not express with the builder''s fields, shown to the person so nothing is silently dropped.'
              type: array
              maxItems: 20
              items: {type: string, maxLength: 200}
    AssistantExplainRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/AssistantExplainTarget'}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        date: {type: string, format: date}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantExplanation:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [target, text, sent]
          properties:
            target: {$ref: '#/components/schemas/AssistantExplainTarget'}
            text: {type: string, maxLength: 2000}
            sent: {type: string, description: 'The JSON summary the model saw, exactly.'}
    AssistantAskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantToolCall:
      type: object
      additionalProperties: false
      required: [name, input, ok]
      properties:
        name: {type: string, maxLength: 64}
        input: {type: object}
        ok: {type: boolean}
    AssistantAnswer:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [answer, refused, capped, tool_calls]
          properties:
            answer: {type: string, maxLength: 3000, description: 'Empty when refused.'}
            refused: {type: boolean}
            capped: {type: boolean, description: 'True when the five-call limit stopped the lookups.'}
            tool_calls: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/AssistantToolCall'}}
    AssistantAnswerPath:
      type: string
      enum: [checked, checked_after_retry, fallback_summary]
      description: 'checked: every number matched the facts; checked_after_retry: matched after one corrective turn; fallback_summary: the model''s answer was not shown, the text is built from the facts alone.'
    AssistantHandoverRequest:
      type: object
      additionalProperties: false
      properties:
        window_hours: {type: integer, enum: [4, 8, 12], default: 8}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantHandover:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [window_hours, window_from, window_to, text, answer_path, sent]
          properties:
            window_hours: {type: integer, enum: [4, 8, 12]}
            window_from: {type: string, format: date-time}
            window_to: {type: string, format: date-time, description: 'The board''s clock (the replay time in demo mode).'}
            text: {type: string, maxLength: 2000, description: 'Plain text, one point per line, 5 to 8 lines.'}
            answer_path: {$ref: '#/components/schemas/AssistantAnswerPath'}
            sent: {type: string, description: 'The JSON summary the model saw, exactly.'}
    AssistantAlertsDigestRequest:
      type: object
      additionalProperties: false
      properties:
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantAlertGroup:
      type: object
      additionalProperties: false
      required: [category, severity, count, latest_at]
      properties:
        category: {type: string, enum: [model, rule, roster, leave, import, integration, fallback, security, update, system, dispatch]}
        severity: {type: string, enum: [info, warning, critical]}
        count: {type: integer, minimum: 1}
        latest_at: {type: string, format: date-time}
    AssistantAlertsDigest:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [unread, groups, text, answer_path, sent]
          properties:
            unread: {type: integer, minimum: 0}
            groups: {type: array, maxItems: 33, items: {$ref: '#/components/schemas/AssistantAlertGroup'}, description: 'Critical first, then warning, then info; most first.'}
            text: {type: string, maxLength: 1200, description: 'Empty when unread is 0.'}
            answer_path: {$ref: '#/components/schemas/AssistantAnswerPath'}
            sent: {type: string, description: 'The JSON summary the model saw, exactly; empty when unread is 0.'}
    AssistantFeature:
      type: string
      enum: [rule_draft, explain, ask, tool_call]
    AssistantTestErrorCode:
      type: string
      enum: [off, not_configured, timeout, provider_error, empty_answer]
    AssistantUsageRow:
      type: object
      additionalProperties: false
      required: [feature, calls, successes, failures, denied, rejected, retried, fallbacks, median_ms, p90_ms]
      properties:
        feature: {$ref: '#/components/schemas/AssistantFeature'}
        calls: {type: integer, minimum: 0, description: 'Audit events of this feature in the window, every outcome.'}
        successes: {type: integer, minimum: 0}
        failures: {type: integer, minimum: 0, description: 'The provider did not answer.'}
        denied: {type: integer, minimum: 0, description: 'Refused for the role.'}
        rejected: {type: [integer, 'null'], minimum: 0, description: 'rule_draft only: the draft failed the rule checks. Null for other features.'}
        retried: {type: [integer, 'null'], minimum: 0, description: 'explain only: answers sent back once by the number check. Null for other features.'}
        fallbacks: {type: [integer, 'null'], minimum: 0, description: 'explain only: answers replaced by the plain facts summary. Null for other features.'}
        median_ms: {type: [integer, 'null'], minimum: 0, description: 'Null when no event of this feature records a duration (tool_call).'}
        p90_ms: {type: [integer, 'null'], minimum: 0}
    AssistantTestResult:
      type: object
      additionalProperties: false
      required: [ok, provider, model, duration_ms, error_code, tested_at]
      properties:
        ok: {type: boolean}
        provider: {$ref: '#/components/schemas/AssistantProvider'}
        model: {type: string, maxLength: 120, description: 'Empty when off.'}
        duration_ms: {type: integer, minimum: 0, description: '0 when no call was made.'}
        error_code: {oneOf: [{$ref: '#/components/schemas/AssistantTestErrorCode'}, {type: 'null'}]}
        tested_at: {$ref: '#/components/schemas/Timestamp'}
    AssistantOverview:
      type: object
      additionalProperties: false
      required: [status, provider, model, offline, key, set_in, window_days, totals, usage, last_test, data_source]
      properties:
        status: {type: string, enum: [on, off, not_configured]}
        provider: {$ref: '#/components/schemas/AssistantProvider'}
        model: {type: string, maxLength: 120, description: 'Empty when off.'}
        offline: {type: boolean, description: 'True when nothing leaves the install (ollama, or off).'}
        key: {type: string, enum: [configured, not_configured, not_needed], description: 'Whether OPENDISPATCH_ASSISTANT_API_KEY is set for the openai provider. Never the key or any part of it. not_needed for ollama, off, and an openai endpoint without a key.'}
        set_in: {type: string, enum: [server_environment], description: 'Where provider and model are set: OPENDISPATCH_ASSISTANT_* on the api.'}
        window_days: {type: integer, minimum: 1, maximum: 31}
        totals:
          type: object
          additionalProperties: false
          required: [calls, successes, within_10s]
          description: 'rule_draft, explain and ask together; tool calls and tests are not counted.'
          properties:
            calls: {type: integer, minimum: 0}
            successes: {type: integer, minimum: 0}
            within_10s: {type: integer, minimum: 0, description: 'Successes with a recorded duration of 10 000 ms or less.'}
        usage:
          type: array
          maxItems: 4
          description: 'One row per feature with at least one event in the window, in the order rule_draft, explain, ask, tool_call. Empty when there were none.'
          items: {$ref: '#/components/schemas/AssistantUsageRow'}
        last_test:
          description: 'The latest assistant.test audit event in the window, or null.'
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [ok, duration_ms, error_code, tested_at]
              properties:
                ok: {type: boolean}
                duration_ms: {type: integer, minimum: 0}
                error_code: {oneOf: [{$ref: '#/components/schemas/AssistantTestErrorCode'}, {type: 'null'}]}
                tested_at: {$ref: '#/components/schemas/Timestamp'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    AssistantImportRequest:
      type: object
      additionalProperties: false
      required: [import_id]
      properties:
        import_id: {$ref: '#/components/schemas/Uuid'}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantMappingColumn:
      type: object
      additionalProperties: false
      required: [source_column, internal_field, confidence, reason, matched_by]
      properties:
        source_column: {type: string, maxLength: 80, description: 'A column of the uploaded file''s header.'}
        internal_field: {type: [string, 'null'], maxLength: 64, description: 'A field of the base mapping; null when nothing fits.'}
        confidence: {type: string, enum: [high, medium, low]}
        reason: {type: string, maxLength: 200}
        matched_by: {type: string, enum: [exact, assistant], description: 'exact: same name as the mapping, matched by the api.'}
    AssistantMappingField:
      type: object
      additionalProperties: false
      required: [internal_field, mapped_column, type, required]
      properties:
        internal_field: {type: string, maxLength: 64}
        mapped_column: {type: string, maxLength: 80, description: 'The base mapping''s column name for this field.'}
        type: {type: string, maxLength: 32}
        required: {type: boolean}
    AssistantMappingSuggestion:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [import_id, base_version, columns, fields, missing_required, sent]
          properties:
            import_id: {$ref: '#/components/schemas/Uuid'}
            base_version: {type: string, maxLength: 64}
            columns: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AssistantMappingColumn'}}
            fields: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AssistantMappingField'}}
            missing_required: {type: array, maxItems: 100, items: {type: string, maxLength: 64}, description: 'Required fields no column is suggested for.'}
            sent: {type: string, description: 'The JSON the model saw, exactly.'}
    AssistantIssueGroup:
      type: object
      additionalProperties: false
      required: [issue_type, severity, field, count, rows]
      properties:
        issue_type: {type: string, maxLength: 64}
        severity: {type: string, enum: [error, warning, info]}
        field: {type: [string, 'null'], maxLength: 80}
        count: {type: integer, minimum: 0}
        rows: {type: string, maxLength: 200, description: 'Row ranges of the listed issues, for example 12-40, 55.'}
    AssistantImportIssues:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [import_id, text, fixes, owner_note, cleaning_rules, groups, fallback, sent]
          properties:
            import_id: {$ref: '#/components/schemas/Uuid'}
            text: {type: string, maxLength: 2000, description: 'A plain summary in the requested language.'}
            fixes: {type: array, maxItems: 8, items: {type: string, maxLength: 300}}
            owner_note: {type: string, maxLength: 2000, description: 'A note to the data owner, to copy.'}
            cleaning_rules: {type: array, maxItems: 8, items: {type: string, maxLength: 300}, description: 'A draft, to paste into the mapping notes.'}
            groups: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AssistantIssueGroup'}}
            fallback: {type: boolean, description: 'True when the answer failed the number check and a summary of the groups is shown instead.'}
            sent: {type: string, description: 'The JSON the model saw, exactly.'}
    AssistantEventNoticeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, description: 'Pasted by a person. Emails and long digit runs are masked before sending.'}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantEventDraft:
      type: object
      additionalProperties: false
      required: [name_en, name_ar, notice_type, forecast_event_type, city, zone_ids, start_date, end_date, start_time, end_time, impact, impact_reason, quote, from_hijri]
      properties:
        name_en: {type: string, minLength: 1, maxLength: 120}
        name_ar: {type: [string, 'null'], maxLength: 120}
        notice_type: {$ref: '#/components/schemas/CalendarNoticeType'}
        forecast_event_type: {type: string, enum: [season_event, other]}
        city: {type: [string, 'null'], maxLength: 80, description: 'English city name; null is everywhere.'}
        zone_ids: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Uuid'}, description: 'Empty only when city is null.'}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        start_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        end_time: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        impact: {$ref: '#/components/schemas/CalendarImpact'}
        impact_reason: {type: string, maxLength: 300}
        quote: {type: string, maxLength: 300, description: 'Copied word for word from the notice; checked by the api.'}
        from_hijri: {type: boolean, description: 'The notice gave Hijri dates; the api converted them.'}
    AssistantEventNoticeDraft:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [events, unmapped]
          properties:
            events: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/AssistantEventDraft'}, description: 'Empty: no event found.'}
            unmapped: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
    AssistantScenarioDraftRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantScenarioDraft:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [draft, unmapped]
          properties:
            draft:
              type: object
              additionalProperties: false
              required: [name, base_date, zone_ids, field_agents, vehicles, remote_mode, remote_agents, remote_by_zone, remote_share_percent, shift_pattern_ids]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                base_date: {$ref: '#/components/schemas/LocalDate'}
                zone_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
                field_agents: {type: integer, minimum: -50, maximum: 50, description: 'Change in each chosen zone.'}
                vehicles: {type: integer, minimum: -50, maximum: 50, description: 'Change in each chosen zone.'}
                remote_mode: {type: string, enum: [company, zone]}
                remote_agents: {type: integer, minimum: -50, maximum: 50, description: 'Company-wide change (remote_mode company).'}
                remote_by_zone:
                  type: array
                  description: 'Per-zone changes (remote_mode zone).'
                  items:
                    type: object
                    additionalProperties: false
                    required: [zone_id, remote_agents]
                    properties:
                      zone_id: {$ref: '#/components/schemas/Uuid'}
                      remote_agents: {type: integer, minimum: -50, maximum: 50}
                remote_share_percent: {type: [integer, 'null'], minimum: 0, maximum: 100, multipleOf: 5, description: 'Null: unchanged.'}
                shift_pattern_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
            unmapped: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
    AssistantCaseScreen:
      type: string
      enum: [live_dispatch_board, remote_queue]
      description: 'The screen asking; the server checks access on its module.'
    CasePhotoRef:
      description: 'A reference to one case photo in the install''s object storage, under the tenant''s own prefix. The customer has supplied none; nothing is ever fabricated.'
      type: object
      additionalProperties: false
      required: [key, content_type]
      properties:
        key: {type: string, minLength: 1, maxLength: 300}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        taken_at: {$ref: '#/components/schemas/NullableTimestamp'}
    AssistantCaseClassification:
      description: 'What the assistant suggests. Vocabulary from the rule criteria.'
      type: object
      additionalProperties: false
      required: [handling, severity, injury_present, damage_assessment_method, confidence, reason, quote]
      properties:
        handling: {$ref: '#/components/schemas/Handling'}
        severity: {type: string, enum: [minor, moderate, severe]}
        injury_present: {type: boolean}
        damage_assessment_method: {type: string, enum: [photo, video, in_person]}
        confidence: {type: number, minimum: 0, maximum: 1}
        reason: {type: string, minLength: 1, maxLength: 200, description: 'One line, in the requested language.'}
        quote: {type: string, minLength: 1, maxLength: 200, description: 'Words from the description the reason rests on; the api checks they are in the text sent.'}
    AssistantRuleView:
      description: 'The rules in force on the registration date applied to the case (the stored live classification when there is one).'
      type: object
      additionalProperties: false
      required: [outcome, handling, rule_code, rule_name_en, rule_name_ar]
      properties:
        outcome: {$ref: '#/components/schemas/RuleOutcome'}
        handling: {$ref: '#/components/schemas/Handling'}
        rule_code: {type: [string, 'null'], maxLength: 32, description: 'Null when the default applied.'}
        rule_name_en: {type: [string, 'null'], maxLength: 200}
        rule_name_ar: {type: [string, 'null'], maxLength: 200}
    AssistantCaseReview:
      type: object
      additionalProperties: false
      required: [decision, reviewed_at, reviewed_by_name]
      properties:
        decision: {type: string, enum: [accepted, rejected]}
        reviewed_at: {$ref: '#/components/schemas/Timestamp'}
        reviewed_by_name: {type: string, maxLength: 120}
        note: {type: [string, 'null'], maxLength: 300}
    AssistantCaseSuggestionSummary:
      description: 'The latest suggestion in brief, for a board card or a queue row.'
      type: object
      additionalProperties: false
      required: [handling, confidence, agrees_with_rules, reviewed]
      properties:
        handling: {$ref: '#/components/schemas/Handling'}
        confidence: {type: number, minimum: 0, maximum: 1}
        agrees_with_rules: {type: boolean}
        reviewed: {type: [string, 'null'], enum: [accepted, rejected, null]}
    AssistantCaseSuggestionRequest:
      type: object
      additionalProperties: false
      required: [from]
      properties:
        from: {$ref: '#/components/schemas/AssistantCaseScreen'}
        locale: {$ref: '#/components/schemas/Locale'}
    AssistantCaseReviewRequest:
      type: object
      additionalProperties: false
      required: [from, decision, suggested_at]
      properties:
        from: {$ref: '#/components/schemas/AssistantCaseScreen'}
        decision: {type: string, enum: [accepted, rejected]}
        suggested_at: {$ref: '#/components/schemas/Timestamp', description: 'The suggestion the person saw.'}
        note: {type: [string, 'null'], maxLength: 300}
    AssistantCaseSuggestion:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [case_id, locale, classification, rule, agrees_with_rules, photos_supplied, photos_sent, text_only, sent, suggested_at, review]
          properties:
            case_id: {$ref: '#/components/schemas/Uuid'}
            locale: {$ref: '#/components/schemas/Locale'}
            classification: {$ref: '#/components/schemas/AssistantCaseClassification'}
            rule: {$ref: '#/components/schemas/AssistantRuleView'}
            agrees_with_rules: {type: boolean, description: 'Suggested handling equals the rule outcome''s handling.'}
            photos_supplied: {type: integer, minimum: 0}
            photos_sent: {type: integer, minimum: 0}
            text_only: {type: boolean, description: 'True when the provider reads text only (ollama).'}
            sent: {type: string, maxLength: 2000, description: 'The description exactly as the model saw it, after scrubbing.'}
            suggested_at: {$ref: '#/components/schemas/Timestamp'}
            review: {oneOf: [{$ref: '#/components/schemas/AssistantCaseReview'}, {type: 'null'}]}
    AssistantCaseView:
      type: object
      additionalProperties: false
      required: [case_id, case_number, narrative_en, narrative_ar, photos, rule, suggestion, data_source]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        case_number: {type: string, maxLength: 64}
        narrative_en: {type: [string, 'null'], maxLength: 1000, description: 'Synthetic until the customer supplies case text.'}
        narrative_ar: {type: [string, 'null'], maxLength: 1000}
        photos: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/CasePhotoRef'}}
        rule: {$ref: '#/components/schemas/AssistantRuleView'}
        suggestion: {oneOf: [{$ref: '#/components/schemas/AssistantCaseSuggestion'}, {type: 'null'}]}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ClassifierReviewItem:
      type: object
      additionalProperties: false
      required: [case_id, case_number, zone_id, registered_at, suggestion, rule, agrees_with_rules, recorded_severity, review, data_source]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        case_number: {type: string, maxLength: 64}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        suggestion: {$ref: '#/components/schemas/AssistantCaseClassification'}
        rule: {$ref: '#/components/schemas/AssistantRuleView'}
        agrees_with_rules: {type: boolean}
        recorded_severity: {type: [string, 'null'], enum: [minor, moderate, severe, null]}
        provider: {type: string, maxLength: 40}
        model: {type: string, maxLength: 120}
        review: {oneOf: [{$ref: '#/components/schemas/AssistantCaseReview'}, {type: 'null'}]}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ClassifierReview:
      type: object
      additionalProperties: false
      required: [from, to, cases_compared, handling_agreed, severity_agreed, disagreements, reviewed, items, illustrative, data_source]
      properties:
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        cases_compared: {type: integer, minimum: 0}
        handling_agreed: {type: integer, minimum: 0}
        severity_agreed: {type: integer, minimum: 0, description: 'Against the recorded severity, where the case has one.'}
        disagreements: {type: integer, minimum: 0}
        reviewed: {type: integer, minimum: 0, description: 'Suggestions a person accepted or rejected.'}
        items: {type: array, items: {$ref: '#/components/schemas/ClassifierReviewItem'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        illustrative: {type: boolean, description: 'Always true until the descriptions are real the customer data.'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ClassifierRunRequest:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: {type: integer, minimum: 1, maximum: 25}
        locale: {$ref: '#/components/schemas/Locale'}
    ClassifierRun:
      allOf:
        - $ref: '#/components/schemas/AssistantMeta'
        - type: object
          required: [requested, classified, failed, stopped_reason]
          properties:
            requested: {type: integer, minimum: 0}
            classified: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0, description: 'Answers refused by the checks (ASSISTANT_INVALID_OUTPUT).'}
            stopped_reason: {type: [string, 'null'], maxLength: 200, description: 'Why the run stopped early (a provider failure), else null.'}
    RuleVersionStatus:
      type: string
      enum: [draft, submitted, active, rejected, retired, superseded]
    ClassificationRule:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [rule_code, name_en, status, active_version, source_note]
          properties:
            rule_code: {$ref: '#/components/schemas/RuleCode'}
            name_en: {type: string, maxLength: 200}
            name_ar: {type: [string, 'null'], maxLength: 200}
            status: {type: string, enum: [draft, active, retired]}
            active_version: {type: [integer, 'null'], minimum: 1}
            source_note: {type: [string, 'null'], maxLength: 500, description: 'Where the rule comes from.'}
      unevaluatedProperties: false
    RuleVersion:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [rule_id, rule_code, version, condition, condition_text_en, outcome, status, effective_from]
          properties:
            rule_id: {$ref: '#/components/schemas/Uuid'}
            rule_code: {$ref: '#/components/schemas/RuleCode'}
            version: {type: integer, minimum: 1}
            condition: {$ref: '#/components/schemas/RuleCondition'}
            condition_text_en: {type: string, maxLength: 500, description: Plain-language condition as in the role matrix.}
            outcome: {$ref: '#/components/schemas/RuleOutcome'}
            status: {$ref: '#/components/schemas/RuleVersionStatus'}
            effective_from: {$ref: '#/components/schemas/NullableDate'}
            effective_to: {$ref: '#/components/schemas/NullableDate'}
            submitted_at: {$ref: '#/components/schemas/NullableTimestamp'}
            decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
            decided_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            decision_note: {type: [string, 'null'], maxLength: 500}
      unevaluatedProperties: false
    RuleVersionWrite:
      type: object
      additionalProperties: false
      required: [condition, condition_text_en, outcome]
      properties:
        condition: {$ref: '#/components/schemas/RuleCondition'}
        condition_text_en: {type: string, minLength: 1, maxLength: 500}
        outcome: {$ref: '#/components/schemas/RuleOutcome'}
        effective_from: {$ref: '#/components/schemas/NullableDate'}
        effective_to: {$ref: '#/components/schemas/NullableDate'}
    RuleCreate:
      type: object
      additionalProperties: false
      required: [rule_code, name_en, first_version]
      properties:
        rule_code: {$ref: '#/components/schemas/RuleCode'}
        name_en: {type: string, minLength: 1, maxLength: 200}
        name_ar: {type: [string, 'null'], maxLength: 200}
        source_note: {type: [string, 'null'], maxLength: 500}
        first_version: {$ref: '#/components/schemas/RuleVersionWrite'}
    Approval:
      description: A request waiting for, or holding, a decision. Nobody approves their own request.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [subject_type, subject_id, status, summary_en, requested_at]
          properties:
            subject_type: {type: string, enum: [rule_version, roster, override]}
            subject_id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [pending, approved, rejected, cancelled]}
            summary_en: {type: string, maxLength: 300}
            requested_at: {$ref: '#/components/schemas/Timestamp'}
            decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
            decided_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            decision_note: {type: [string, 'null'], maxLength: 500}
      unevaluatedProperties: false
    DecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: {type: [string, 'null'], maxLength: 500, description: Required when rejecting.}
    # ---- Plans ----
    ForecastRun:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [model_version, status, horizon_start_date, horizon_days, range_coverage, illustrative]
          properties:
            model_version: {type: string, maxLength: 64}
            engine_version: {type: [string, 'null'], maxLength: 64}
            rule_set_version: {type: [string, 'null'], maxLength: 64}
            status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
            horizon_start_date: {$ref: '#/components/schemas/LocalDate'}
            horizon_days: {type: integer, minimum: 1, maximum: 30}
            range_coverage: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
            illustrative: {type: boolean, description: True while the forecast is a placeholder or from synthetic data.}
            input_data_sources: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/DataSource'}}
            started_at: {$ref: '#/components/schemas/NullableTimestamp'}
            finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
            error_message: {type: [string, 'null'], maxLength: 500}
            dataset_snapshot_id: {type: [string, 'null'], maxLength: 64, description: 'Data versioning: the history the run was fitted on; the same case counts give the same id. Absent on runs made before it was recorded.'}
      unevaluatedProperties: false
    ForecastValue:
      description: >-
        One stored forecast row: zone x sub-zone x 15-minute interval. Invariant: low <= expected <=
        high; field_expected + remote_inferred_expected = expected within 0.01; 96 intervals per day.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [forecast_run_id, zone_id, sub_zone_id, interval_start, interval_index, low, expected, high, field_expected, remote_inferred_expected]
          properties:
            forecast_run_id: {$ref: '#/components/schemas/Uuid'}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            sub_zone_id: {$ref: '#/components/schemas/Uuid'}
            interval_start: {$ref: '#/components/schemas/Timestamp'}
            interval_index: {type: integer, minimum: 0, maximum: 95}
            low: {type: number, minimum: 0}
            expected: {type: number, minimum: 0}
            high: {type: number, minimum: 0}
            field_expected: {type: number, minimum: 0}
            remote_inferred_expected: {type: number, minimum: 0}
      unevaluatedProperties: false
    ForecastRunCreate:
      type: object
      additionalProperties: false
      required: [horizon_start_date, horizon_days]
      properties:
        horizon_start_date: {$ref: '#/components/schemas/LocalDate'}
        horizon_days: {type: integer, minimum: 1, maximum: 30}
    ForecastSplit:
      description: Field and remote_inferred split per zone under a rule version, so the Forecast Explorer can show the effect of a rule change.
      type: object
      additionalProperties: false
      required: [rule_set_version, generated_at, data_source, illustrative, zones]
      properties:
        rule_set_version: {type: string, maxLength: 64}
        generated_at: {$ref: '#/components/schemas/Timestamp'}
        data_source: {$ref: '#/components/schemas/DataSource'}
        illustrative: {type: boolean}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, field_expected, remote_inferred_expected, field_share]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              field_expected: {type: number, minimum: 0}
              remote_inferred_expected: {type: number, minimum: 0}
              field_share: {type: [number, 'null'], minimum: 0, maximum: 1}
    RosterStatus:
      type: string
      enum: [building, draft, submitted, approved, rejected, published, superseded]
    Roster:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [zone_id, roster_date, status, forecast_run_id, planning_level, illustrative]
          properties:
            zone_id: {$ref: '#/components/schemas/Uuid'}
            roster_date: {$ref: '#/components/schemas/LocalDate'}
            status: {$ref: '#/components/schemas/RosterStatus'}
            forecast_run_id: {$ref: '#/components/schemas/NullableUuid'}
            planning_level: {$ref: '#/components/schemas/PlanningLevel'}
            optimizer_status: {type: [string, 'null'], enum: [feasible, partial, infeasible, null]}
            optimizer_source: {type: [string, 'null'], enum: [optimizer, fallback, null], description: 'Where the lines came from. Null when built before this field existed or with engines off.'}
            fallback_reason: {type: [string, 'null'], enum: [no_forecast_for_day, engine_unavailable, no_answer, null], description: Set only when optimizer_source is fallback.}
            engine_version: {type: [string, 'null'], maxLength: 64}
            optimizer_model: {type: [string, 'null'], maxLength: 64, description: 'Optional. The optimizer model that ran, from its answer.'}
            solver_status: {type: [string, 'null'], enum: [optimal, feasible, heuristic, null], description: 'Optional. From the answer: optimal (proven), feasible (best found) or heuristic.'}
            illustrative: {type: boolean}
            gap_count: {type: [integer, 'null'], minimum: 0}
            surplus_count: {type: [integer, 'null'], minimum: 0}
            approved_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            approved_at: {$ref: '#/components/schemas/NullableTimestamp'}
            published_at: {$ref: '#/components/schemas/NullableTimestamp'}
      unevaluatedProperties: false
    RosterBuildRequest:
      type: object
      additionalProperties: false
      required: [zone_id, roster_date]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        forecast_run_id: {$ref: '#/components/schemas/NullableUuid', description: Omit to use the latest succeeded forecast run.}
    RosterAssignment:
      description: One agent on one shift in one zone on one date, with optional vehicle and planned break.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [roster_id, agent_id, shift_pattern_id, zone_id, roster_date, start_at, end_at, vehicle_id, is_override]
          properties:
            roster_id: {$ref: '#/components/schemas/Uuid'}
            agent_id: {$ref: '#/components/schemas/Uuid'}
            shift_pattern_id: {$ref: '#/components/schemas/Uuid'}
            zone_id: {$ref: '#/components/schemas/NullableUuid'}
            roster_date: {$ref: '#/components/schemas/LocalDate'}
            start_at: {$ref: '#/components/schemas/Timestamp'}
            end_at: {$ref: '#/components/schemas/Timestamp'}
            vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
            break_start_at: {$ref: '#/components/schemas/NullableTimestamp'}
            break_end_at: {$ref: '#/components/schemas/NullableTimestamp'}
            standby_point_id: {$ref: '#/components/schemas/NullableUuid'}
            is_override: {type: boolean}
      unevaluatedProperties: false
    OverrideChangeType:
      type: string
      enum: [replace_agent, change_shift, change_vehicle, remove_assignment, add_assignment]
    Override:
      description: A manual change to a roster. reason_code is required; note is required when it is `other`. Needs approval before it takes effect.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [roster_id, change_type, reason_code, status]
          properties:
            roster_id: {$ref: '#/components/schemas/Uuid'}
            roster_assignment_id: {$ref: '#/components/schemas/NullableUuid'}
            change_type: {$ref: '#/components/schemas/OverrideChangeType'}
            reason_code: {$ref: '#/components/schemas/OverrideReasonCode'}
            note: {type: [string, 'null'], maxLength: 500}
            before: {type: [object, 'null'], additionalProperties: true}
            after: {type: [object, 'null'], additionalProperties: true}
            status: {type: string, enum: [pending, approved, rejected]}
            decided_by_user_id: {$ref: '#/components/schemas/NullableUuid'}
            decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
            decision_note: {type: [string, 'null'], maxLength: 500}
        - if:
            type: object
            required: [reason_code]
            properties: {reason_code: {const: other}}
          then:
            type: object
            required: [note]
            properties: {note: {type: string, minLength: 1}}
      unevaluatedProperties: false
    OverrideCreate:
      type: object
      additionalProperties: false
      required: [change_type, reason_code]
      properties:
        roster_assignment_id: {$ref: '#/components/schemas/NullableUuid'}
        change_type: {$ref: '#/components/schemas/OverrideChangeType'}
        reason_code: {$ref: '#/components/schemas/OverrideReasonCode'}
        note: {type: [string, 'null'], maxLength: 500, description: Required (non-empty) when reason_code is other.}
        agent_id: {$ref: '#/components/schemas/NullableUuid'}
        shift_pattern_id: {$ref: '#/components/schemas/NullableUuid'}
        vehicle_id: {$ref: '#/components/schemas/NullableUuid'}
    RosterWeekRequest:
      type: object
      additionalProperties: false
      required: [week_start]
      properties:
        week_start: {$ref: '#/components/schemas/LocalDate', description: 'Any day of the week; the result names the first.'}
    RosterWeekBuildRequest:
      type: object
      additionalProperties: false
      required: [week_start]
      properties:
        week_start: {$ref: '#/components/schemas/LocalDate'}
        zone_ids: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: 'Omit for every zone the caller may write.'}
        forecast_run_id: {$ref: '#/components/schemas/NullableUuid', description: Omit to use the latest succeeded forecast run.}
    WeeklyLimits:
      description: 'Settings planning.max_days_per_week (default 6) and planning.max_hours_per_week (default 48), counted over the calendar week (localization first_day_of_week) on the hours of shift less break. An agent at a limit is sent to the optimizer as unavailable. Assumption until the customer confirms.'
      type: object
      additionalProperties: false
      required: [max_days_per_week, max_hours_per_week]
      properties:
        max_days_per_week: {type: integer, minimum: 1, maximum: 7}
        max_hours_per_week: {type: number, minimum: 1, maximum: 168}
    RosterWeekCell:
      type: object
      additionalProperties: false
      required: [roster_date, roster, agents, state]
      properties:
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        roster: {oneOf: [{$ref: '#/components/schemas/Roster'}, {type: 'null'}]}
        agents: {type: integer, minimum: 0, description: Field agents on the roster.}
        state: {type: string, enum: [buildable, kept, passed, too_far], description: 'What Build week does with the cell: buildable (none yet, draft or rejected), kept (submitted, approved or published), passed, too_far.'}
    RosterWeekZone:
      type: object
      additionalProperties: false
      required: [zone_id, cells]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        cells: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/RosterWeekCell'}}
    RosterWeek:
      type: object
      additionalProperties: false
      required: [week_start, days, zones, limits, illustrative]
      properties:
        week_start: {$ref: '#/components/schemas/LocalDate'}
        days: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/LocalDate'}}
        zones: {type: array, items: {$ref: '#/components/schemas/RosterWeekZone'}}
        limits: {$ref: '#/components/schemas/WeeklyLimits'}
        illustrative: {type: boolean}
    RosterWeekSkip:
      type: object
      additionalProperties: false
      required: [zone_id, roster_date, reason]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        reason: {type: string, enum: [passed, too_far, kept, not_draft, not_approved, failed]}
        message: {type: string, maxLength: 300}
    RosterWeekResult:
      type: object
      additionalProperties: false
      required: [week_start, done, skipped, elapsed_ms]
      properties:
        week_start: {$ref: '#/components/schemas/LocalDate'}
        done: {type: array, items: {$ref: '#/components/schemas/Roster'}, description: 'The rosters built, submitted or (stub) published.'}
        skipped: {type: array, items: {$ref: '#/components/schemas/RosterWeekSkip'}}
        stub: {type: boolean, description: 'True for publish: nothing was sent to the customer.'}
        elapsed_ms: {type: integer, minimum: 0}
    NetAvailabilityRow:
      type: object
      additionalProperties: false
      required: [zone_id, shift_pattern_id, agents, shift_hours, leave_hours, rest_hours, break_hours, prayer_hours, sick_hours, net_hours]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        shift_pattern_id: {$ref: '#/components/schemas/Uuid'}
        agents: {type: integer, minimum: 0, description: Distinct agents counted on this shift in the week.}
        shift_hours: {type: number, minimum: 0, description: Agent-hours of the shift on every counted day.}
        leave_hours: {type: number, minimum: 0, description: 'Approved leave of any type.'}
        rest_hours: {type: number, minimum: 0, description: 'Rest days (days off) not rostered.'}
        break_hours: {type: number, minimum: 0, description: 'The break rule of the shift.'}
        prayer_hours: {type: number, minimum: 0, description: 'Prayer windows inside the shift, less the part a lined-up break already holds.'}
        sick_hours: {type: number, minimum: 0, description: 'Sick-leave provision: the share sick_leave_days_per_fte_year / working_days_per_fte_year of the hours left.'}
        net_hours: {type: number, minimum: 0}
    NetAvailability:
      type: object
      additionalProperties: false
      required: [week_start, days, rows, sick_share, prayer_window_minutes, prayer_policy, illustrative, data_source, data_sources]
      properties:
        week_start: {$ref: '#/components/schemas/LocalDate'}
        days: {type: integer, const: 7}
        rows: {type: array, items: {$ref: '#/components/schemas/NetAvailabilityRow'}}
        sick_share: {type: number, minimum: 0, maximum: 1, description: 'Expected share off sick (1 - available_share of the demand basis).'}
        prayer_window_minutes: {type: integer, minimum: 0, maximum: 90}
        prayer_policy: {type: string, enum: [clear_of_prayer, lined_up_with_prayer]}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
        data_sources: {type: array, items: {$ref: '#/components/schemas/DataSource'}}
    PublishResult:
      description: Publishing a roster to the customer is a labelled stub. `stub` is always true and nothing is sent.
      type: object
      additionalProperties: false
      required: [roster_id, stub, published, message]
      properties:
        roster_id: {$ref: '#/components/schemas/Uuid'}
        stub: {const: true}
        published: {const: false}
        message: {type: string, maxLength: 200}
    ScenarioAdjustments:
      type: object
      additionalProperties: false
      properties:
        headcount_delta:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              field_agents: {type: integer}
              remote_agents: {type: integer}
              vehicles: {type: integer}
        shift_pattern_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        remote_share: {type: [number, 'null'], minimum: 0, maximum: 1}
    Scenario:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [name, base_date, zone_ids, adjustments, status]
          properties:
            name: {type: string, minLength: 1, maxLength: 120}
            base_date: {$ref: '#/components/schemas/LocalDate'}
            zone_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
            adjustments: {$ref: '#/components/schemas/ScenarioAdjustments'}
            status: {type: string, enum: [draft, running, completed, failed]}
            last_run_at: {$ref: '#/components/schemas/NullableTimestamp'}
      unevaluatedProperties: false
    ScenarioWrite:
      type: object
      additionalProperties: false
      required: [name, base_date, zone_ids, adjustments]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        base_date: {$ref: '#/components/schemas/LocalDate'}
        zone_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        adjustments: {$ref: '#/components/schemas/ScenarioAdjustments'}
    SimulationRun:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [roster_id, run_date, assignment_policy, primary_clock_start, threshold_seconds, status, illustrative]
          properties:
            roster_id: {$ref: '#/components/schemas/NullableUuid'}
            scenario_id: {$ref: '#/components/schemas/NullableUuid'}
            run_date: {$ref: '#/components/schemas/LocalDate'}
            assignment_policy: {type: string, enum: [nearest, scorer, replay_actual]}
            primary_clock_start: {$ref: '#/components/schemas/ClockStart'}
            threshold_seconds: {type: integer, minimum: 1}
            status: {type: string, enum: [queued, running, succeeded, failed]}
            illustrative: {type: boolean}
            engine_version: {type: [string, 'null'], maxLength: 64}
            finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
      unevaluatedProperties: false
    SimulationRunCreate:
      type: object
      additionalProperties: false
      required: [roster_id, run_date]
      properties:
        roster_id: {$ref: '#/components/schemas/Uuid'}
        run_date: {$ref: '#/components/schemas/LocalDate'}
        assignment_policy: {type: string, enum: [nearest, scorer, replay_actual], default: nearest}
    ServiceLevelReading:
      type: object
      additionalProperties: false
      required: [within_count, case_count, share]
      properties:
        within_count: {type: integer, minimum: 0}
        case_count: {type: integer, minimum: 0}
        share: {type: [number, 'null'], minimum: 0, maximum: 1}
    SimulationResult:
      description: One stored result row. interval_start null means the whole zone for the run date. Both readings are always present.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [simulation_run_id, zone_id, interval_start, case_count, field_case_count, from_registration, from_assignment]
          properties:
            simulation_run_id: {$ref: '#/components/schemas/Uuid'}
            zone_id: {$ref: '#/components/schemas/Uuid'}
            interval_start: {$ref: '#/components/schemas/NullableTimestamp'}
            case_count: {type: integer, minimum: 0}
            field_case_count: {type: integer, minimum: 0}
            from_registration: {$ref: '#/components/schemas/ServiceLevelReading'}
            from_assignment: {$ref: '#/components/schemas/ServiceLevelReading'}
            median_assigned_to_arrived_seconds: {type: [number, 'null'], minimum: 0}
            p90_assigned_to_arrived_seconds: {type: [number, 'null'], minimum: 0}
      unevaluatedProperties: false
    # ---- Admin ----
    User:
      description: A person who can sign in. Linked to Keycloak by keycloak_subject. Accounts are created at first SSO sign-in from group rules, or invited here.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [email, display_name, assigned_role, zone_ids, status, is_emergency_admin]
          properties:
            keycloak_subject: {type: [string, 'null'], maxLength: 128}
            email: {type: string, format: email, maxLength: 254}
            display_name: {type: string, minLength: 1, maxLength: 120}
            assigned_role: {$ref: '#/components/schemas/RoleId'}
            zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: Empty for roles whose scope is the whole install or the remote pool.}
            status: {type: string, enum: [invited, active, disabled]}
            is_emergency_admin: {type: boolean, description: Local account with OpenDispatch-enforced MFA. The only local account (assumption A8).}
            last_sign_in_at: {$ref: '#/components/schemas/NullableTimestamp'}
            preferred_locale: {$ref: '#/components/schemas/Locale'}
      unevaluatedProperties: false
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, display_name, assigned_role]
      properties:
        email: {type: string, format: email, maxLength: 254}
        display_name: {type: string, minLength: 1, maxLength: 120}
        assigned_role: {$ref: '#/components/schemas/RoleId'}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    UserUpdate:
      type: object
      additionalProperties: false
      required: [display_name, assigned_role, zone_ids]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        assigned_role: {$ref: '#/components/schemas/RoleId'}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    RoleMapping:
      description: Group-to-role rule. A signed-in person whose groups match no rule gets no access, never a default role. Entra ID groups are matched by object ID.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [identity_provider_id, group_match, group_match_type, assigned_role, zone_ids, priority]
          properties:
            identity_provider_id: {$ref: '#/components/schemas/NullableUuid'}
            group_match: {type: string, minLength: 1, maxLength: 256}
            group_match_type: {type: string, enum: [exact, object_id, prefix]}
            assigned_role: {$ref: '#/components/schemas/RoleId'}
            zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
            priority: {type: integer, minimum: 1, description: Lower number wins when several rules match.}
            is_enabled: {type: boolean}
      unevaluatedProperties: false
    RoleMappingWrite:
      type: object
      additionalProperties: false
      required: [group_match, group_match_type, assigned_role]
      properties:
        identity_provider_id: {$ref: '#/components/schemas/NullableUuid'}
        group_match: {type: string, minLength: 1, maxLength: 256}
        group_match_type: {type: string, enum: [exact, object_id, prefix]}
        assigned_role: {$ref: '#/components/schemas/RoleId'}
        zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        priority: {type: integer, minimum: 1, default: 100}
        is_enabled: {type: boolean, default: true}
    Setting:
      description: A stored setting. Typed views of the important ones are in SettingsSnapshot.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [key, value]
          properties:
            key: {type: string, pattern: '^[a-z][a-z0-9_.]*$', maxLength: 128}
            value: {description: 'Any JSON value, validated by the owning module.'}
      unevaluatedProperties: false
    Integration:
      description: A data feed or channel (case feed, agent status and location feed, assignment channel, optional feeds). Holds no secrets; credentials are references to the customer's secret store.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [kind, name_en, direction, is_enabled, health, last_success_at]
          properties:
            kind: {type: string, enum: [case_feed, agent_feed, assignment_channel, weather_feed, routing_feed, other]}
            name_en: {type: string, maxLength: 120}
            direction: {type: string, enum: [inbound, outbound]}
            is_enabled: {type: boolean}
            endpoint_label: {type: [string, 'null'], maxLength: 200, description: Display label only. Real hostnames are supplied at install time.}
            credential_ref: {type: [string, 'null'], maxLength: 200}
            health: {type: string, enum: [healthy, degraded, down, unknown, disabled]}
            last_success_at: {$ref: '#/components/schemas/NullableTimestamp'}
            last_error_at: {$ref: '#/components/schemas/NullableTimestamp'}
            last_error_message: {type: [string, 'null'], maxLength: 500}
            fallback_timeout_seconds: {type: [integer, 'null'], minimum: 1, maximum: 300, description: 'Assignment channel only. Working assumption 5.'}
      unevaluatedProperties: false
    IntegrationUpdate:
      type: object
      additionalProperties: false
      properties:
        is_enabled: {type: boolean}
        endpoint_label: {type: [string, 'null'], maxLength: 200}
        credential_ref: {type: [string, 'null'], maxLength: 200}
        fallback_timeout_seconds: {type: [integer, 'null'], minimum: 1, maximum: 300}
    ImportJob:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [file_name, mapping_version, status, row_count, issue_count]
          properties:
            file_name: {type: string, maxLength: 255}
            mapping_version: {type: string, maxLength: 64, description: 'For example generic_csv_v1.'}
            status: {type: string, enum: [uploaded, validating, validated, compared, dry_run_done, cut_over, failed, rolled_back]}
            row_count: {type: integer, minimum: 0}
            issue_count: {type: integer, minimum: 0}
            error_count: {type: integer, minimum: 0}
            warning_count: {type: integer, minimum: 0}
            storage_ref: {type: [string, 'null'], maxLength: 500, description: Object-storage key. Real files never enter the repository.}
            validated_at: {$ref: '#/components/schemas/NullableTimestamp'}
            cut_over_at: {$ref: '#/components/schemas/NullableTimestamp'}
            step: {type: [string, 'null'], enum: [validate, compare, dry_run, cut_over, rollback, null], description: 'The last step started in the background (POST /imports/{id}/steps).'}
            step_state: {type: [string, 'null'], enum: [running, succeeded, failed, null], description: 'A step whose api stopped is failed (no heartbeat for a minute); a cut-over or roll-back that fails keeps nothing.'}
            step_rows_done: {type: [integer, 'null'], minimum: 0, description: 'File rows read so far by the step.'}
            step_rows_total: {type: [integer, 'null'], minimum: 0, description: 'The rows of the file; null for a roll-back.'}
            step_started_at: {$ref: '#/components/schemas/NullableTimestamp'}
            step_finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
            step_error: {type: [string, 'null'], maxLength: 1000}
            step_result:
              description: 'What a finished compare, dry run, cut-over or roll-back returned; null for validate (the job holds its counts).'
              anyOf:
                - {$ref: '#/components/schemas/ImportComparison'}
                - {$ref: '#/components/schemas/CutoverResult'}
                - {$ref: '#/components/schemas/ImportRollbackResult'}
                - {type: 'null'}
      unevaluatedProperties: false
    DataQualityIssue:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [issue_type, severity, status, message]
          properties:
            import_job_id: {$ref: '#/components/schemas/NullableUuid'}
            case_id: {$ref: '#/components/schemas/NullableUuid'}
            row_number: {type: [integer, 'null'], minimum: 1}
            field: {type: [string, 'null'], maxLength: 64}
            issue_type:
              type: string
              enum: [assigned_before_registered, unusual_parties_count, missing_required_field, unknown_reference, duplicate_external_id, out_of_range_coordinate, inconsistent_name_case, other]
            severity: {type: string, enum: [error, warning, info]}
            status: {type: string, enum: [open, acknowledged, resolved, ignored]}
            message: {type: string, maxLength: 500}
      unevaluatedProperties: false
    Notification:
      description: An in-app notification, also the source of the bell count.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [recipient_user_id, category, severity, title_en, is_read]
          properties:
            recipient_user_id: {$ref: '#/components/schemas/NullableUuid'}
            recipient_role: {type: [string, 'null'], enum: [administrator, dispatch_supervisor, dispatcher, planner, remote_team_lead, viewer_auditor, change_approver, null]}
            category: {type: string, enum: [model, rule, roster, leave, import, integration, fallback, security, update, system, dispatch]}
            severity: {type: string, enum: [info, warning, critical]}
            title_en: {type: string, maxLength: 200}
            title_ar: {type: [string, 'null'], maxLength: 200}
            body_en: {type: [string, 'null'], maxLength: 500}
            link_path: {type: [string, 'null'], maxLength: 300}
            is_read: {type: boolean}
            read_at: {$ref: '#/components/schemas/NullableTimestamp'}
      unevaluatedProperties: false
    # ---- Audit ----
    AuditEvent:
      description: Append only. There is no update or delete operation; updated_at equals created_at.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
        - type: object
          required: [occurred_at, actor_type, action, entity_type, outcome, summary_en]
          properties:
            occurred_at: {$ref: '#/components/schemas/Timestamp'}
            actor_type: {type: string, enum: [user, system, emergency_admin, demo]}
            actor_user_id: {$ref: '#/components/schemas/NullableUuid'}
            action: {type: string, pattern: '^[a-z][a-z0-9_.]*$', maxLength: 96, description: 'For example rule.approved, roster.override.created, sign_in.emergency_admin.'}
            entity_type: {type: string, maxLength: 64}
            entity_id: {type: [string, 'null'], maxLength: 128}
            outcome: {type: string, enum: [success, failure, denied]}
            summary_en: {type: string, maxLength: 500}
            correlation_id: {type: [string, 'null'], maxLength: 64}
            detail: {$ref: '#/components/schemas/Extra'}
            summary_params:
              description: 'The values of the summary sentence, for a translated summary of the action; absent when the action gives none.'
              type: object
              maxProperties: 12
              additionalProperties: {type: [string, number]}
      unevaluatedProperties: false
    # ---- Ops views (composed, not tables) ----
    AssignmentEngineOutput:
      description: Assignment engine result for one case (contracts/engines/assignment.output.schema.json).
      $ref: './engines/assignment.output.schema.json'
    ForecasterEngineOutput:
      description: Forecaster result (contracts/engines/forecaster.output.schema.json).
      $ref: './engines/forecaster.output.schema.json'
    OptimizerEngineOutput:
      description: Roster optimizer result (contracts/engines/optimizer.output.schema.json).
      $ref: './engines/optimizer.output.schema.json'
    SimulatorEngineOutput:
      description: Simulator result (contracts/engines/simulator.output.schema.json).
      $ref: './engines/simulator.output.schema.json'
    ZoneStage:
      description: Live-assignment stage of one zone. Setting; the Administrator changes it in Admin 9 and the Live Dispatch Board shows it read-only. Demo default (decision 9) is shadow everywhere except two Riyadh zones on recommend.
      type: object
      additionalProperties: false
      required: [zone_id, stage, updated_at, data_source]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        stage: {$ref: '#/components/schemas/LiveStage'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        updated_by: {$ref: '#/components/schemas/NullableUuid'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ZoneStageUpdate:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage: {$ref: '#/components/schemas/LiveStage'}
        reason: {type: [string, 'null'], maxLength: 300}
    FallbackState:
      description: Whether the customer's own dispatch is assigning cases instead of OpenDispatch. OpenDispatch never assigns a case that the customer's dispatch already assigned.
      type: object
      additionalProperties: false
      required: [state, reason, since, timeout_seconds, opendispatch_healthy, fallback_assigned_count, data_source]
      properties:
        state: {type: string, enum: [armed, active, maintenance]}
        reason: {type: string, enum: [none, feed_outage, health_check_failed, maintenance, manual, opendispatch_timeout], description: 'Why fallback is active. feed_outage: the case feed is down or silent; health_check_failed: the assignment scorer is unreachable; opendispatch_timeout: OpenDispatch missed its decision deadline in an Automatic zone; manual: a person sent the signal. OpenDispatch sends the fallback signal itself for feed silence, health_check_failed and opendispatch_timeout.'}
        since: {$ref: '#/components/schemas/NullableTimestamp'}
        timeout_seconds: {type: integer, minimum: 1, description: 'Working assumption 5. The customer''s dispatch measures it; OpenDispatch only shows it.'}
        opendispatch_healthy: {type: boolean}
        fallback_assigned_count: {type: integer, minimum: 0, description: Cases assigned by the customer's fallback since `since` (or today when armed).}
        last_signal: {type: [string, 'null'], enum: [fallback, resume, null]}
        last_signal_at: {$ref: '#/components/schemas/NullableTimestamp'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    FallbackSignalRequest:
      description: Tells the customer's system to use its own assignment until told otherwise (fallback), or to hand control back (resume).
      type: object
      additionalProperties: false
      required: [signal, reason]
      properties:
        signal: {type: string, enum: [fallback, resume]}
        reason: {type: string, minLength: 1, maxLength: 300}
    ReplayState:
      description: Replay of one synthetic day for flow 11. Demo only; in oidc mode the board reads the real case feed.
      type: object
      additionalProperties: false
      required: [status, replay_date, replay_at, speed, total_cases, delivered_cases, feed_outage_active, data_source]
      properties:
        status: {type: string, enum: [stopped, playing, paused, finished]}
        replay_date: {$ref: '#/components/schemas/LocalDate'}
        replay_at: {$ref: '#/components/schemas/Timestamp'}
        speed: {type: number, exclusiveMinimum: 0, maximum: 600, description: Replay seconds per real second.}
        total_cases: {type: integer, minimum: 0}
        delivered_cases: {type: integer, minimum: 0}
        feed_outage_active: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ReplayControl:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [play, pause, stop, seek, set_speed]}
        replay_at: {$ref: '#/components/schemas/Timestamp', description: 'For seek.'}
        speed: {type: number, exclusiveMinimum: 0, maximum: 600}
    FeedOutageRequest:
      description: Demo only. Simulates a feed outage so the board switches to fallback.
      type: object
      additionalProperties: false
      required: [feed, active]
      properties:
        feed: {type: string, enum: [case_feed, agent_feed, assignment_channel]}
        active: {type: boolean}
    RecommendationSummary:
      type: object
      additionalProperties: false
      required: [agent_id, estimated_travel_seconds, estimated_arrival_at, reason_codes, reason_text]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid'}
        estimated_travel_seconds: {type: integer, minimum: 0}
        estimated_arrival_at: {$ref: '#/components/schemas/Timestamp'}
        reason_codes:
          type: array
          items: {$ref: './engines/assignment.output.schema.json#/$defs/AssignmentReasonCode'}
        reason_text: {type: string, maxLength: 200}
    LiveCase:
      description: One row of the Live Dispatch Board.
      type: object
      additionalProperties: false
      required: [case_id, case_number, zone_id, registered_at, latitude, longitude, state, stage, data_source]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        case_number: {type: string, maxLength: 64}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        sub_zone_id: {$ref: '#/components/schemas/NullableUuid'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        latitude: {$ref: '#/components/schemas/Latitude'}
        longitude: {$ref: '#/components/schemas/Longitude'}
        parties_involved: {type: integer, minimum: 0}
        state: {type: string, enum: [waiting, recommended, assigned, fallback_assigned, overridden, remote]}
        stage: {$ref: '#/components/schemas/LiveStage'}
        assignment_id: {$ref: '#/components/schemas/NullableUuid'}
        assigned_agent_id: {$ref: '#/components/schemas/NullableUuid'}
        assignment_source: {type: [string, 'null'], enum: [OPENDISPATCH, CUSTOMER_FALLBACK, MANUAL, null]}
        estimated_arrival_at: {$ref: '#/components/schemas/NullableTimestamp'}
        recommendation: {oneOf: [{$ref: '#/components/schemas/RecommendationSummary'}, {type: 'null'}]}
        customer_agent_id: {$ref: '#/components/schemas/NullableUuid', description: 'Shadow mode: the agent the customer actually chose.'}
        classification: {$ref: '#/components/schemas/LiveClassification'}
        ai_suggestion: {$ref: '#/components/schemas/AssistantCaseSuggestionSummary', description: 'Optional. The latest AI suggestion in brief; never changes the case''s handling.'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    LiveClassification:
      description: >-
        The approved rules applied to a reported case: the outcome, the rule that decided it (none when the
        default applied) and the rule set in force. `handling` is what the case is routed by: the feed's own handling
        when it sent one and the setting classification.live_handling_source is feed (the default), else the rules'.
      type: object
      additionalProperties: false
      required: [outcome, handling, source, rule_code, rule_version, rule_name_en, rule_name_ar, rule_set_version, feed_handling, classified_at]
      properties:
        outcome: {$ref: '#/components/schemas/RuleOutcome'}
        handling: {$ref: '#/components/schemas/Handling'}
        source: {type: string, enum: [feed, rules], description: Which of the two decided `handling`.}
        rule_code: {type: [string, 'null'], maxLength: 32, description: Null when no rule matched and the default outcome applied.}
        rule_version: {type: [integer, 'null'], minimum: 1}
        rule_name_en: {type: [string, 'null'], maxLength: 200}
        rule_name_ar: {type: [string, 'null'], maxLength: 200}
        rule_set_version: {type: string, maxLength: 64, description: 'The signature of the rules in force on the registration date (as on FieldShare).'}
        feed_handling: {oneOf: [{$ref: '#/components/schemas/Handling'}, {type: 'null'}], description: 'The handling the feed sent, or null.'}
        classified_at: {$ref: '#/components/schemas/Timestamp', description: 'When the rules ran: on arrival for the feeds, at registration for the demo replay.'}
    LiveBoard:
      description: Everything the board draws in one call. Agent positions come from listAgentStatuses.
      type: object
      additionalProperties: false
      required: [as_of, fallback, stages, cases, data_source]
      properties:
        as_of: {$ref: '#/components/schemas/Timestamp'}
        replay: {oneOf: [{$ref: '#/components/schemas/ReplayState'}, {type: 'null'}]}
        fallback: {$ref: '#/components/schemas/FallbackState'}
        stages: {type: array, items: {$ref: '#/components/schemas/ZoneStage'}}
        cases: {type: array, items: {$ref: '#/components/schemas/LiveCase'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    AcceptRecommendationRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid', description: The agent the dispatcher saw and accepts. Refused with CONFLICT when the recommendation has since changed.}
    OverrideAssignmentRequest:
      type: object
      additionalProperties: false
      required: [agent_id, reason_code]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid'}
        reason_code: {$ref: '#/components/schemas/OverrideReasonCode'}
        note: {type: [string, 'null'], maxLength: 500, description: Required (non-empty) when reason_code is other.}
    ShadowComparisonSummary:
      type: object
      additionalProperties: false
      required: [from, to, cases_compared, differed_count, opendispatch, customer, illustrative, data_source]
      properties:
        zone_id: {$ref: '#/components/schemas/NullableUuid'}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        cases_compared: {type: integer, minimum: 0}
        differed_count: {type: integer, minimum: 0}
        opendispatch: {$ref: '#/components/schemas/ShadowSideSummary'}
        customer: {$ref: '#/components/schemas/ShadowSideSummary'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    ShadowSideSummary:
      type: object
      additionalProperties: false
      required: [median_travel_seconds, from_registration, from_assignment]
      properties:
        median_travel_seconds: {type: [number, 'null'], minimum: 0}
        from_registration: {$ref: '#/components/schemas/ServiceLevelReading'}
        from_assignment: {$ref: '#/components/schemas/ServiceLevelReading'}
    RemoteQueueItem:
      type: object
      additionalProperties: false
      required: [case_id, case_number, zone_id, registered_at, status, data_source]
      properties:
        case_id: {$ref: '#/components/schemas/Uuid'}
        case_number: {type: string, maxLength: 64}
        zone_id: {$ref: '#/components/schemas/Uuid'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
        status: {type: string, enum: [waiting, in_review, done]}
        assigned_reviewer_id: {$ref: '#/components/schemas/NullableUuid'}
        review_started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        review_finished_at: {$ref: '#/components/schemas/NullableTimestamp'}
        classification: {$ref: '#/components/schemas/LiveClassification', description: Present on a reported (live) case the rules routed remote.}
        ai_suggestion: {$ref: '#/components/schemas/AssistantCaseSuggestionSummary', description: 'Optional. The latest AI suggestion in brief; never changes the case''s handling.'}
        data_source: {$ref: '#/components/schemas/DataSource'}
    RemoteStaffingInterval:
      type: object
      additionalProperties: false
      required: [interval_start, interval_index, expected_cases, required_reviewers, planned_reviewers, delta]
      properties:
        interval_start: {$ref: '#/components/schemas/Timestamp'}
        interval_index: {type: integer, minimum: 0, maximum: 95}
        expected_cases: {type: number, minimum: 0}
        required_reviewers: {type: number, minimum: 0}
        planned_reviewers: {type: number, minimum: 0}
        delta: {type: number}
        on_shift: {type: integer, minimum: 0, description: 'Optional. Remote agents on shift and not on a break at the interval start.'}
    RemoteAssignRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: {$ref: '#/components/schemas/Uuid', description: A remote agent.}
    CoverageArea:
      type: object
      additionalProperties: false
      required: [standby_point_id, latitude, longitude, coverage_radius_m, recommended_agents, covered_sub_zone_ids]
      properties:
        standby_point_id: {$ref: '#/components/schemas/Uuid'}
        latitude: {$ref: '#/components/schemas/Latitude'}
        longitude: {$ref: '#/components/schemas/Longitude'}
        coverage_radius_m: {type: integer, minimum: 100}
        recommended_agents: {type: integer, minimum: 0}
        covered_sub_zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        reach_minutes: {type: number, minimum: 0, description: 'Optional. Travel minutes across coverage_radius_m under the travel model settings.'}
        home_distance_km: {type: number, minimum: 0, description: 'Optional (spec 4.4). Straight-line km from the zone''s dispatch centre (its coordinates); absent when the zone has none.'}
        beyond_deploy_limit: {type: boolean, description: 'Optional (spec 4.4). True when home_distance_km exceeds max_deploy_distance_km: the point cannot host the zone''s agents, and no move goes there.'}
    Coverage:
      description: Where agents should wait for one zone and date, with the coverage radius of each point.
      type: object
      additionalProperties: false
      required: [zone_id, roster_date, areas, uncovered_sub_zone_ids, illustrative, data_source]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        roster_id: {$ref: '#/components/schemas/NullableUuid'}
        areas: {type: array, items: {$ref: '#/components/schemas/CoverageArea'}}
        uncovered_sub_zone_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        reach_share: {type: number, minimum: 0, maximum: 1, description: 'Optional. Share of the day''s forecast field demand (equal per sub-zone without a forecast) whose sub-zone centre is within the service-level threshold of travel from a staffed standby point.'}
        max_deploy_distance_km: {type: number, exclusiveMinimum: 0, maximum: 500, description: 'Optional (spec 4.4, 7). Setting planning.max_deploy_distance_km, default 15: how far from its home dispatch centre an agent is deployed. Also sent to the optimizer.'}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    GapSurplusView:
      description: Gap and surplus for a roster or scenario. Cells use the optimizer's GapCell (delta = planned - required).
      type: object
      additionalProperties: false
      required: [roster_date, planning_level, cells, illustrative, data_source]
      properties:
        roster_id: {$ref: '#/components/schemas/NullableUuid'}
        scenario_id: {$ref: '#/components/schemas/NullableUuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        planning_level: {$ref: '#/components/schemas/PlanningLevel'}
        cells: {type: array, items: {$ref: './engines/optimizer.output.schema.json#/$defs/GapCell'}}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
        required_staffing: {$ref: '#/components/schemas/RequiredStaffingBasis'}
    RequiredStaffingBasis:
      description: 'How required and planned were counted. Setting planning.demand_method: duration (the default since 3 Oct 2026, the specification''s method: field cases x travel + on-scene + admin minutes, over 15) or rate_convention (cases per agent per interval, setting planning.cases_per_agent_per_interval, default 0.5: one case per agent per half hour, the customer''s own convention). Travel and on-scene are the mean of the last 90 days of field cases unless set (planning.travel_minutes, planning.on_scene_minutes); admin is a setting (planning.admin_minutes, default 10), an assumption until the customer supplies it. Planned is the rostered headcount times available_share: an expected sick-leave provision (planning.sick_leave_days_per_fte_year, default 5, over planning.working_days_per_fte_year, default 230), spread evenly, never random. travel, on-scene and admin are measured per zone over planning.duration_history_days (admin only when planning.admin_minutes is not stored), and the sick provision is per zone and calendar month from the sick-leave history when there is enough (zones[].available_share); the top-level available_share stays the assumed rate.'
      type: object
      additionalProperties: false
      required: [method, admin_minutes, sick_leave_days_per_fte_year, working_days_per_fte_year, available_share, zones, illustrative]
      properties:
        method: {type: string, enum: [rate_convention, duration]}
        duration_history_days: {type: integer, minimum: 7, maximum: 365, description: 'Optional. The rolling window of field cases the duration method measures travel, on-scene and admin minutes over (setting planning.duration_history_days, default 90).'}
        sick_leave_method: {type: string, enum: [history, assumed], description: 'Optional. Setting planning.sick_leave_method (default history: each zone''s rate by calendar month from sick_leave_history over planning.sick_leave_history_months, default 24, when it has at least six months; else the assumed rate).'}
        admin_minutes: {type: [number, 'null'], minimum: 0, description: 'Null under rate_convention. The stored planning.admin_minutes, else 10: used for a zone with no measured admin time.'}
        sick_leave_days_per_fte_year: {type: number, minimum: 0}
        working_days_per_fte_year: {type: number, exclusiveMinimum: 0}
        available_share: {type: number, exclusiveMinimum: 0, maximum: 1}
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zone_id, travel_minutes, on_scene_minutes, minutes_per_case, cases_per_agent_per_interval, from_history]
            properties:
              zone_id: {$ref: '#/components/schemas/Uuid'}
              travel_minutes: {type: [number, 'null'], minimum: 0, description: 'Null under rate_convention.'}
              on_scene_minutes: {type: [number, 'null'], minimum: 0}
              minutes_per_case: {type: [number, 'null'], minimum: 0}
              cases_per_agent_per_interval: {type: number, exclusiveMinimum: 0}
              from_history: {type: boolean, description: 'True when travel and on-scene are means of stored cases, not settings.'}
              admin_minutes: {type: [number, 'null'], minimum: 0, description: 'Optional. The zone''s admin minutes a case under duration (measured, closed less on-scene completed, unless planning.admin_minutes is stored); null under rate_convention.'}
              admin_from_history: {type: boolean, description: 'Optional. True when admin_minutes is measured.'}
              available_share: {type: number, exclusiveMinimum: 0, maximum: 1, description: 'Optional. The zone''s share not off sick on the view''s date (planned = rostered x this).'}
              sick_source: {type: string, enum: [history, assumed], description: 'Optional.'}
        illustrative: {type: boolean}
    ScenarioRunResult:
      description: Result of running a scenario. Gap view recalculates from the optimizer output.
      type: object
      additionalProperties: false
      required: [scenario_id, generated_at, optimizer, data_source, illustrative]
      properties:
        scenario_id: {$ref: '#/components/schemas/Uuid'}
        generated_at: {$ref: '#/components/schemas/Timestamp'}
        optimizer: {$ref: '#/components/schemas/OptimizerEngineOutput'}
        simulation: {oneOf: [{$ref: '#/components/schemas/SimulatorEngineOutput'}, {type: 'null'}]}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    SimulationRunDetail:
      type: object
      additionalProperties: false
      required: [run, output]
      properties:
        run: {$ref: '#/components/schemas/SimulationRun'}
        output: {oneOf: [{$ref: '#/components/schemas/SimulatorEngineOutput'}, {type: 'null'}]}
    LeaveCoverageEffect:
      description: What approving one leave request does to coverage, against forecast demand.
      type: object
      additionalProperties: false
      required: [leave_request_id, zone_id, cells, new_gap_intervals, illustrative, data_source]
      properties:
        leave_request_id: {$ref: '#/components/schemas/Uuid'}
        zone_id: {$ref: '#/components/schemas/NullableUuid'}
        cells:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [interval_start, required, planned_before, planned_after]
            properties:
              interval_start: {$ref: '#/components/schemas/Timestamp'}
              required: {type: number, minimum: 0}
              planned_before: {type: number, minimum: 0}
              planned_after: {type: number, minimum: 0}
        new_gap_intervals: {type: integer, minimum: 0}
        summary_en: {type: string, maxLength: 300}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
    LeaveDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: {type: [string, 'null'], maxLength: 500, description: Required when declining.}
    LeaveWindow:
      type: object
      additionalProperties: false
      required: [zone_id, start_date, end_date, demand_index, spare_capacity, recommended]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        demand_index: {type: number, minimum: 0, description: Forecast demand relative to the zone's average (1.0 = average).}
        spare_capacity: {type: integer, description: Agents that could be on leave without opening a gap.}
        recommended: {type: boolean}
    LeaveOutlook:
      description: The long-horizon leave outlook (getLeaveOutlook). Illustrative, always.
      type: object
      additionalProperties: false
      required: [start_date, weeks, grant_below, restrict_above, max_concurrent_leave_share, zones, illustrative, data_source, data_sources]
      properties:
        start_date: {$ref: '#/components/schemas/LocalDate'}
        weeks: {type: integer, enum: [13, 52]}
        grant_below: {type: number, minimum: 0, maximum: 1, description: 'A week at least this far below normal demand (a share) can take leave (setting leave.outlook_grant_below).'}
        restrict_above: {type: number, minimum: 0, maximum: 1, description: 'A week at least this far above normal demand restricts leave (setting leave.outlook_restrict_above).'}
        max_concurrent_leave_share: {type: number, minimum: 0, maximum: 1, description: From the leave policy.}
        zones: {type: array, items: {$ref: '#/components/schemas/LeaveOutlookZone'}}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
        data_sources: {type: array, items: {$ref: '#/components/schemas/DataSource'}, description: The case history's sources; more than one means mixed.}
    LeaveOutlookZone:
      type: object
      additionalProperties: false
      required: [zone_id, field_agents, leave_limit, history_start, history_end, weeks]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        field_agents: {type: integer, minimum: 0, description: Active field agents whose home zone this is.}
        leave_limit: {type: integer, minimum: 0, description: 'At most this many on leave at once (the policy share of field_agents, rounded down).'}
        history_start: {type: [string, 'null'], format: date}
        history_end: {type: [string, 'null'], format: date}
        sick_source: {type: string, enum: [history, assumed], description: 'Optional. Where expected_sick_absence comes from: the zone''s sick-leave history (setting planning.sick_leave_method history, at least six months of sick_leave_history), else the assumed rate (planning.sick_leave_days_per_fte_year over planning.working_days_per_fte_year).'}
        weeks: {type: array, maxItems: 52, items: {$ref: '#/components/schemas/LeaveOutlookWeek'}, description: Empty when the zone has under 8 weeks of history.}
    LeaveOutlookWeek:
      type: object
      additionalProperties: false
      required: [start_date, end_date, expected_field_cases, normal_field_cases, demand_change, approved_leave_days, leave_room, status, reasons, reason_en]
      properties:
        start_date: {$ref: '#/components/schemas/LocalDate'}
        end_date: {$ref: '#/components/schemas/LocalDate'}
        expected_field_cases: {type: number, minimum: 0}
        normal_field_cases: {type: number, minimum: 0, description: "The same seven days at the zone's trend level and weekday pattern, with no calendar effect."}
        demand_change: {type: number, description: 'expected / normal - 1.'}
        approved_leave_days: {type: integer, minimum: 0, description: Person-days of approved leave of the zone's field agents in the week.}
        expected_sick_absence: {type: number, minimum: 0, description: 'Optional. Field agents expected off sick on a day of the week: field_agents x the sick share of the week''s days (by zone and calendar month). Taken out of leave_room.'}
        leave_room: {type: integer, minimum: 0, description: 'More agents who could be on leave in the week, within the policy and the demand, after expected_sick_absence.'}
        status: {type: string, enum: [grant, normal, restrict]}
        reasons:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [code, effect]
            properties:
              code: {type: string, enum: [ramadan, eid_fitr, eid_adha, hajj, national_day, founding_day, payday, school_break, season_event, umrah, blackout, leave_full]}
              effect: {type: [number, 'null'], description: 'The driver alone, as a share of the week (+0.18 is +18%); null for blackout and leave_full.'}
              label: {type: string, maxLength: 120, description: 'The blackout period or event name, when there is one.'}
        reason_en: {type: string, maxLength: 300}
    BreakSlot:
      type: object
      additionalProperties: false
      required: [roster_assignment_id, agent_id, start_at, end_at, prayer_conflict]
      properties:
        roster_assignment_id: {$ref: '#/components/schemas/Uuid'}
        agent_id: {$ref: '#/components/schemas/Uuid'}
        start_at: {$ref: '#/components/schemas/Timestamp'}
        end_at: {$ref: '#/components/schemas/Timestamp'}
        prayer_conflict: {type: [string, 'null'], enum: [fajr, dhuhr, asr, maghrib, isha, null], description: 'Prayer whose time overlaps the break, if any.'}
    BreakPlan:
      type: object
      additionalProperties: false
      required: [zone_id, roster_date, slots, illustrative, data_source]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
        slots: {type: array, items: {$ref: '#/components/schemas/BreakSlot'}}
        illustrative: {type: boolean}
        data_source: {$ref: '#/components/schemas/DataSource'}
        coverage_cost: {$ref: '#/components/schemas/BreakCoverageCost'}
        prayer_policy: {$ref: '#/components/schemas/BreakPrayerPolicy'}
        prayer_window_minutes: {type: integer, minimum: 5, maximum: 90, description: 'Optional. The window the slots were judged with.'}
    BreakCoverageCost:
      description: 'Optional (spec 4.5). What the placed breaks cost in field coverage, from the latest forecast. Illustrative.'
      type: object
      additionalProperties: false
      required: [expected_cases, lost_agent_intervals, max_concurrent_breaks, peak_share_away, max_share]
      properties:
        expected_cases: {type: number, minimum: 0, description: 'Forecast field cases in break intervals, each divided by the agents on duty then.'}
        lost_agent_intervals: {type: integer, minimum: 0, description: 'Agent 15-minute intervals spent on break, as the optimizer output break_cost counts them.'}
        max_concurrent_breaks: {type: integer, minimum: 0, description: 'Most agents on break in one 15-minute interval.'}
        peak_share_away: {type: number, minimum: 0, maximum: 1, description: 'Highest share of on-duty agents on break in one 15-minute interval.'}
        max_share: {type: number, exclusiveMinimum: 0, maximum: 1, description: 'Setting breaks.max_concurrent_share, default 0.34: the most of a zone the planner sends on break at once.'}
    BreakGenerateRequest:
      type: object
      additionalProperties: false
      required: [zone_id, roster_date]
      properties:
        zone_id: {$ref: '#/components/schemas/Uuid'}
        roster_date: {$ref: '#/components/schemas/LocalDate'}
    BreakSlotUpdate:
      type: object
      additionalProperties: false
      required: [start_at]
      properties:
        start_at: {$ref: '#/components/schemas/Timestamp'}
    RollupLevel:
      type: string
      enum: [zone, city, kingdom]
    DashboardRollup:
      description: Roll-up table refreshed by the worker (an ordinary table with tenant_id, never a materialized view). Both 10-minute readings are always present.
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseRecord'
