name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  REDOCLY_TELEMETRY: 'off'

jobs:
  web:
    name: Web, tooling and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Stylelint
        run: pnpm lint:css
      - name: Contracts
        run: pnpm validate:contracts
      - name: Generated types are up to date
        run: pnpm generate:types && git diff --exit-code apps/web/src/lib/types
      - name: Fixtures are up to date
        run: pnpm generate:fixtures && pnpm validate:fixtures && pnpm calibration:check && git diff --exit-code fixtures apps/web/public/samples
      - name: Unit tests
        run: pnpm test:pure
      - name: Build
        run: pnpm build

  go:
    name: Go api and worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The -oss build of TimescaleDB (Apache-2.0).
        image: timescale/timescaledb:2.30.2-pg16-oss
        env:
          POSTGRES_USER: opendispatch_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: opendispatch_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENDISPATCH_TEST_DATABASE_URL: postgres://opendispatch_owner:ci-owner-password@localhost:5432/opendispatch_ci
      OPENDISPATCH_TEST_APP_DATABASE_URL: postgres://opendispatch_app:ci-app-password@localhost:5432/opendispatch_ci
      # Import files: SeaweedFS (Apache-2.0) S3 gateway, as in docker-compose.yml. CI-only credentials.
      OPENDISPATCH_S3_ENDPOINT: 127.0.0.1
      OPENDISPATCH_S3_PORT: '8333'
      OPENDISPATCH_S3_USE_SSL: 'false'
      OPENDISPATCH_S3_ACCESS_KEY: ci-access-key
      OPENDISPATCH_S3_SECRET_KEY: ci-only-s3-secret
      OPENDISPATCH_S3_BUCKET: opendispatch-imports
    steps:
      - uses: actions/checkout@v4
      - name: Object storage (SeaweedFS S3 gateway)
        # Started here, not under services: it needs the compose start script from the checkout.
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e OPENDISPATCH_S3_ACCESS_KEY -e OPENDISPATCH_S3_SECRET_KEY \
            -v "$PWD/deploy/compose/s3-start.sh:/opt/s3-start.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.48 /opt/s3-start.sh
          for i in $(seq 1 60); do
            if echo "s3.bucket.create -name $OPENDISPATCH_S3_BUCKET" | docker exec -i s3 weed shell 2>&1 | grep -Eq 'created bucket|already exist'; then
              echo "bucket $OPENDISPATCH_S3_BUCKET ready"; exit 0
            fi
            sleep 2
          done
          docker logs s3; exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Application role (no BYPASSRLS)
        run: |
          psql "$OPENDISPATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE opendispatch_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO opendispatch_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE opendispatch_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO opendispatch_app;
          SQL
      - name: Migrate and seed from the fixtures
        # The live tests run over the seeded database, as with the compose stack.
        run: |
          (cd apps/api-go && OPENDISPATCH_OWNER_DATABASE_URL="$OPENDISPATCH_TEST_DATABASE_URL" go run ./cmd/migrate)
          OPENDISPATCH_MIGRATION_DATABASE_URL="$OPENDISPATCH_TEST_DATABASE_URL" pnpm seed:postgres -- --reset
      - name: gofmt
        run: test -z "$(gofmt -l apps/api-go tools/loadgen)" || { gofmt -l apps/api-go tools/loadgen; exit 1; }
      - name: go vet
        working-directory: apps/api-go
        run: go vet ./...
      - name: Tests, including the cross-tenant isolation tests
        working-directory: apps/api-go
        run: go test -p 1 ./...
      - name: Load generator
        working-directory: tools/loadgen
        run: go vet ./... && go test ./...

  engines:
    name: Python engines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engines/requirements/base.txt
      - run: pip install -r engines/requirements/base.txt pytest jsonschema
      - name: Tests
        working-directory: engines
        run: python -m pytest -q

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint and render each values file
        run: |
          for mode in shared dedicated private; do
            helm lint --strict deploy/helm/opendispatch -f "deploy/helm/opendispatch/values-$mode.yaml"
            helm template "opendispatch-$mode" deploy/helm/opendispatch -f "deploy/helm/opendispatch/values-$mode.yaml" > /dev/null
          done

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: ., file: apps/api-go/Dockerfile, target: api}
          - {name: worker, context: ., file: apps/api-go/Dockerfile, target: worker}
          - {name: engines, context: engines, file: engines/Dockerfile, target: engine}
          - {name: web, context: ., file: apps/web/Dockerfile, target: web}
          - {name: demo-tools, context: ., file: deploy/compose/demo-tools.Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          build-args: OPENDISPATCH_FETCH_MAP=0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Compose file is valid
        if: matrix.name == 'api'
        run: docker compose config --quiet

  hygiene:
    name: Secrets, word list and licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (tree and history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact
          rm gitleaks
      - name: Word list
        run: bash scripts/ci/denylist.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Licence check
        run: bash scripts/ci/licenses.sh
