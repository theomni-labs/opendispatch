{{- /* No auth in the engines: NetworkPolicy limits callers */ -}}
{{- $first := true }}
{{- range $name, $e := .Values.engines }}
{{- $sel := dict "root" $ "component" (printf "engine-%s" $name) }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opendispatch.fullname" $ }}-engine-{{ $name }}
  labels:
    {{- include "opendispatch.labels" $ | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "opendispatch.selector" $sel | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendispatch.fullname" $ }}-engine-{{ $name }}
  labels:
    {{- include "opendispatch.labels" $ | nindent 4 }}
    app.kubernetes.io/component: engine-{{ $name }}
    opendispatch.omni-labs/role: engine
spec:
  replicas: {{ $e.replicas }}
  selector:
    matchLabels:
      {{- include "opendispatch.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opendispatch.selector" $sel | nindent 8 }}
        opendispatch.omni-labs/role: engine
    spec:
      {{- include "opendispatch.podSecurity" $ | nindent 6 }}
      containers:
        - name: engine
          image: {{ include "opendispatch.image" (dict "root" $ "img" $.Values.images.engines "name" "engines") }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENDISPATCH_ENGINE
              value: {{ $name }}
            - name: OPENDISPATCH_CONTRACTS_DIR
              value: /contracts/engines
            - name: HOME
              value: /tmp
            - name: MPLCONFIGDIR
              value: /tmp
          securityContext:
            {{- include "opendispatch.containerSecurity" $ | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: contracts
              mountPath: /contracts/engines
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $e.resources | nindent 12 }}
      volumes:
        - name: contracts
          configMap:
            name: {{ include "opendispatch.fullname" $ }}-engine-contracts
        {{- include "opendispatch.tmpVolume" $ | nindent 8 }}
{{- end }}
