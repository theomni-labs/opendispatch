# Dev and CI Keycloak: pnpm keycloak:dev up
name: ${OPENDISPATCH_KC_PROJECT:-opendispatch-keycloak-dev}

services:
  keycloak:
    # same image as deploy/helm/opendispatch values
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: opendispatch-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OPENDISPATCH_KC_BOOTSTRAP_PASSWORD:?start it with pnpm keycloak:dev up}
      # under /idp as in the chart
      KC_HOSTNAME: ${OPENDISPATCH_KC_HOSTNAME:-http://127.0.0.1:8180/idp}
      # admin console only on this machine
      KC_HOSTNAME_ADMIN: ${OPENDISPATCH_KC_HOSTNAME_ADMIN:-http://127.0.0.1:8180/idp}
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
    ports:
      - "127.0.0.1:${OPENDISPATCH_KC_PORT:-8180}:8080"
    volumes:
      - ../keycloak/realm-opendispatch-dev.json:/opt/keycloak/data/import/realm-opendispatch.json:ro
      - ../keycloak/themes/opendispatch:/opt/keycloak/themes/opendispatch:ro
    labels:
      opendispatch.keycloak.state: ${OPENDISPATCH_KC_STATE_DIR:-}
    healthcheck:
      # no curl in the image: bash asks port 9000
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          while read -r -t 3 line <&3; do case "$$line" in *'"UP"'*) exit 0;; esac; done; exit 1
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 10s
