{{- if .Values.worker.enabled }}
{{- range $i, $t := .Values.tenants }}
{{- $component := printf "worker-%d" $i }}
{{- $sel := dict "root" $ "component" $component }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendispatch.fullname" $ }}-{{ $component }}
  labels:
    {{- include "opendispatch.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    opendispatch.omni-labs/role: worker
spec:
  # one cycle runner per customer
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opendispatch.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opendispatch.selector" $sel | nindent 8 }}
        opendispatch.omni-labs/role: worker
    spec:
      {{- include "opendispatch.podSecurity" $ | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "opendispatch.image" (dict "root" $ "img" $.Values.images.worker "name" "worker") }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: health
              containerPort: 8082
          env:
            - name: OPENDISPATCH_APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.existingSecret }}
                  key: app-url
            - name: OPENDISPATCH_TENANT_ID
              value: {{ $t.id | quote }}
            - name: OPENDISPATCH_WORKER_INTERVAL_SECONDS
              value: {{ $.Values.worker.intervalSeconds | quote }}
            - name: OPENDISPATCH_WORKER_HEALTH_ADDR
              value: ":8082"
            {{- include "opendispatch.engineEnv" $ | nindent 12 }}
            {{- include "opendispatch.recordSourceEnv" $ | nindent 12 }}
          securityContext:
            {{- include "opendispatch.containerSecurity" $ | nindent 12 }}
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 4
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $.Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "opendispatch.tmpVolume" $ | nindent 8 }}
{{- end }}
{{- end }}
